version: 1

# Optional node identity, defaults shown.
# node:
#   id: auth-gateway
#   cluster: auth-gateway

# Optional listener limits, defaults shown.
# listener:
#   port: 8080
#   per_connection_buffer_limit_bytes: 1048576
#   max_request_headers_kb: 32
#   max_request_headers_count: 100
#   request_headers_timeout: 5s
#   request_timeout: 30s
#   connection_idle_timeout: 60s
#   stream_idle_timeout: 60s
#   max_stream_duration: 30s
#   stream_flush_timeout: 5s
#   tls_handshake_timeout: 5s
#   # Optional HTTP/2 overrides, Envoy defaults shown.
#   http2:
#     max_concurrent_streams: 1024
#     initial_stream_window_size: 16777216
#     initial_connection_window_size: 25165824

# Optional overload protection, disabled by default. Choose both capacity budgets.
# overload:
#   max_heap_bytes: 201326592 # Example budget, must be below Envoy's memory limit.
#   max_downstream_connections: 2048 # Example cap, no default.
#   heap_shrink_threshold: 0.90 # Optional, default shown.
#   request_reject_threshold: 0.95 # Optional, default shown.

authenticators:
  - name: internal-jwt
    jwt:
      issuer: https://sso.internal.example.com/realms/observability
      jwks:
        uri: https://sso.internal.example.com/realms/observability/protocol/openid-connect/certs
        # cache_duration: 5m # Optional, default shown.
        # fetch_timeout: 5s # Optional, default shown.
        # connect_timeout: 5s # Optional, default shown.
        # Optional per-provider circuit breakers, same defaults as API clusters.
        # circuit_breakers:
        #   max_connections: 1024
        #   max_pending_requests: 1024
        #   max_requests: 1024
        #   max_retries: 0
        # Custom trust replaces the image's system CA bundle.
        # trusted_ca: {config_map: {name: internal-issuer-ca, key: ca.crt}}
      # Optional. Omit to skip JWT audience validation.
      audiences: [observability-ingestion]
    attributes:
      tenant_id:
        claim_path: [x, y, z, claim]
      writer_id:
        claim_path: [sub]
      requested_tenant: {header: X-Tenant}

  - name: external-jwt
    jwt:
      issuer: https://sso.external.example.com/realms/observability
      jwks:
        uri: https://sso.external.example.com/realms/observability/protocol/openid-connect/certs
        # cache_duration: 5m # Optional, default shown.
        # fetch_timeout: 5s # Optional, default shown.
        # connect_timeout: 5s # Optional, default shown.
      # Optional. Omit to skip JWT audience validation.
      audiences: [observability-ingestion]
    attributes:
      tenant_id:
        claim_path: [organization, id]
      writer_id:
        claim_path: [sub]

  - name: partner-key
    api_key:
      # One Secret holds every key used by this gateway's servers.
      secret: auth-gateway-api-keys
      header: X-Partner-Key # Optional. Defaults to X-API-Key.
    attributes:
      tenant_id: {credential: true}
      writer_id: {credential: true}
      requested_tenant: {header: X-Tenant}

authorization_policies:
  - name: metrics-writers
    grants:
      - authenticator: internal-jwt
        apis: [metrics-write]
        attributes:
          tenant_id: [client-123, client-456]
      - authenticator: external-jwt
        apis: [metrics-write]
        attributes:
          tenant_id: [customer-456]

  - name: logs-writers
    grants:
      - authenticator: internal-jwt
        apis: [logs]
        attributes:
          tenant_id: [client-123]
      - authenticator: external-jwt
        apis: [logs]
        attributes:
          tenant_id: [customer-456, customer-789]

  - name: partner-metrics-writers
    grants:
      - authenticator: partner-key
        apis: [metrics-write]
        attributes:
          tenant_id: [client-123]
          writer_id: [writer-17]
          requested_tenant: [client-123]

# Optional. Enabled by default. Set enabled to false to omit the collector and
# metrics Service port.
observability:
  metrics:
    # Optional. All metered APIs share this counter name. Envoy adds the
    # envoy_http_lua_ prefix; the collector removes it.
    custom_metric_name: gateway_http_requests_total
    enabled: true
    scrape_interval: 30s
    scrape_timeout: 10s

apis:
  - name: metrics-write
    metrics:
      labels:
        tenant: tenant_id
    upstream:
      address: thanos-receive
      port: 19291
      # connect_timeout: 5s # Optional, default shown.
      # per_connection_buffer_limit_bytes: 1048576 # Optional, default shown.
      # http_protocol: http1 # Optional, default shown.
      # Enable only when the backend serves TLS with this identity.
      # tls_config:
      #   server_name: receive.backend.example.com
      #   trusted_ca: {config_map: {name: backend-ca, key: ca.crt}}
    # Optional cluster circuit breakers, defaults shown. No retry policy is created.
    # circuit_breakers:
    #   max_connections: 1024
    #   max_pending_requests: 1024
    #   max_requests: 1024
    #   max_retries: 0
    # Optional API timeouts, defaults shown.
    # timeouts:
    #   response_timeout: 30s
    #   idle_timeout: 60s # Inherits listener.stream_idle_timeout.
    #   max_stream_duration: 30s # Inherits listener.max_stream_duration.
    routes:
      - methods: [POST]
        path:
          exact: /metrics/api/v1/receive
        rewrite:
          path: /api/v1/receive
        processing:
          request_headers:
            - name: X-Scope-OrgID
              from_attribute: tenant_id
            - name: X-Writer-ID
              from_attribute: writer_id

  - name: logs
    metrics: {} # Count responses by API and status without attribute labels.
    upstream:
      address: loki
      port: 3100
      # connect_timeout: 5s # Optional, default shown.
      # http_protocol: http1 # Optional, default shown.
    # timeouts: # Optional API overrides, default shown.
    #   response_timeout: 30s
    routes:
      - methods: [POST]
        path:
          prefix: /logs/otlp/
        # timeouts: # Optional per-route overrides, inherit the API by default.
        #   response_timeout: 30s
        rewrite:
          prefix: /otlp/
        # Processing is optional; each route selects its own outputs.
        processing:
          request_headers:
            - name: X-Scope-OrgID
              from_attribute: tenant_id
processing:
  - name: upstream-tenants
    type: attribute-mapper
    attributes:
      tenant_id:
        mappings:
          client-123: team-a
          client-456: team-b
          customer-456: team-a
          customer-789: team-b

servers:
  # Plain HTTP for the internal hop after TLS termination at an ingress.
  - hostname: write-internal.auth.example.com
    authentication:
      # Accept JWTs from either configured issuer.
      any_of: [internal-jwt, external-jwt]
    authorization:
      # Either policy can grant access to the requested API.
      any_of: [metrics-writers, logs-writers]
    apis: [metrics-write, logs]

  # TLS terminates at the gateway for this SNI hostname.
  - hostname: write.auth.example.com
    tls_config:
      secret: write-gateway-tls
      # certificate: /etc/write-gateway-tls/tls.crt # Optional, derived from secret.
      # private_key: /etc/write-gateway-tls/tls.key # Optional, derived from secret.
    authentication:
      any_of: [internal-jwt, external-jwt]
    authorization:
      any_of: [metrics-writers, logs-writers]
    apis: [metrics-write, logs]

  - hostname: partner.auth.example.com
    authentication:
      any_of: [partner-key]
    authorization:
      any_of: [partner-metrics-writers]
    apis: [metrics-write]

  - hostname: either.auth.example.com
    authentication:
      # A valid JWT wins when both credentials are present.
      any_of: [internal-jwt, partner-key]
    authorization:
      any_of: [metrics-writers, partner-metrics-writers]
    apis: [metrics-write]

  - hostname: both.auth.example.com
    authentication:
      # Both credentials and X-Tenant are required. Shared raw attributes must match.
      all_of: [internal-jwt, partner-key]
    authorization:
      all_of: [metrics-writers, partner-metrics-writers]
    apis: [metrics-write]

kubernetes:
  name: auth-gateway
  namespace: observability
  image: envoyproxy/envoy:v1.39.1
  # Optional Kubernetes settings, defaults shown.
  # otel_collector_image: otel/opentelemetry-collector-contrib:0.135.0
  # replicas: 2
  # envoy_concurrency: 2 # Optional example; omitted lets Envoy choose workers.
  # service_port: 80
  # https_service_port: 443 # Only emitted when HTTPS servers exist.
  # resources:
  #   requests:
  #     cpu: 50m
  #     memory: 64Mi
  #   limits:
  #     cpu: "1"
  #     memory: 256Mi
  # metrics:
  #   resources:
  #     requests:
  #       cpu: 20m
  #       memory: 64Mi
  #     limits:
  #       memory: 256Mi # No CPU limit by default.
