# Replace these DNS names, Secrets and CA ConfigMaps before deployment.
# Capacity values illustrate configuration, not measured production sizing.
version: 1

overload:
  max_heap_bytes: 201326592
  max_downstream_connections: 2048
  # heap_shrink_threshold: 0.90 # Optional, default shown.
  # request_reject_threshold: 0.95 # Optional, default shown.

authenticators:
  - name: observability-jwt
    jwt:
      issuer: https://issuer.example.com
      audiences: [observability]
      jwks:
        uri: https://issuer.example.com/.well-known/jwks.json
        # cache_duration: 5m # Optional, default shown.
        # fetch_timeout: 5s # Optional, default shown.
        # connect_timeout: 5s # Optional, default shown.
    attributes:
      tenant_id:
        claim_path: [organization, id]

authorization_policies:
  - name: customer-access
    grants:
      - authenticator: observability-jwt
        apis: [metrics-write, metrics-query]
        attributes:
          tenant_id: [customer-a]

apis:
  - name: metrics-write
    upstream:
      address: thanos-receive.observability.svc.cluster.local
      port: 19291
      # http_protocol: http1 # Optional, default shown.
    routes:
      - methods: [POST]
        path:
          exact: /api/v1/receive
        processing:
          request_headers:
            - name: X-Scope-OrgID
              from_attribute: tenant_id

  - name: metrics-query
    upstream:
      address: thanos-query.observability.svc.cluster.local
      port: 9091
      tls_config:
        server_name: query.backend.example.com
        trusted_ca:
          config_map:
            name: backend-ca
            key: ca.crt
    timeouts:
      response_timeout: 60s
      idle_timeout: 65s
      max_stream_duration: 90s
    routes:
      - methods: [GET, POST]
        path:
          exact: /api/v1/query
      - methods: [GET, POST]
        path:
          exact: /api/v1/query_range
        timeouts:
          response_timeout: 90s
          idle_timeout: 95s
          max_stream_duration: 120s

servers:
  - hostname: observability.example.com
    tls_config:
      secret: gateway-tls
    authentication:
      any_of: [observability-jwt]
    authorization:
      any_of: [customer-access]
    apis: [metrics-write, metrics-query]

kubernetes:
  name: auth-gateway
  namespace: observability
  envoy_concurrency: 2
  # replicas: 2 # Optional, default shown.
  resources:
    requests: {cpu: "1", memory: 256Mi}
    limits: {cpu: "2", memory: 512Mi}

# See config.auth.example.yaml for the full list of optional defaults.
