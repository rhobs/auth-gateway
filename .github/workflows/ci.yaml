name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/tools/go.sum

      - name: Lint
        run: make lint

      - name: Unit and golden tests
        run: make test

      - name: Compile tagged packages
        run: go test -tags=e2e,envoyruntime -run '^$' ./...

      - name: End-to-end tests
        run: make e2e

      - name: Runtime image checks
        run: make test-runtime

      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: e2e/.state/reports/
          include-hidden-files: true
          if-no-files-found: ignore
