name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/tools/go.sum

      - name: Lint
        run: make lint

      - name: Unit and golden tests
        run: make test

      - name: Compile tagged packages
        run: go test -tags=e2e,envoyruntime -run '^$' ./...

      - name: Start Kind cluster
        uses: helm/kind-action@v1.15.0
        with:
          version: v0.30.0
          node_image: kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a
          wait: 10s
          cluster_name: auth-gateway-e2e

      - name: Wait for cluster to bootstrap
        run: kubectl wait --for=condition=Ready pods --all --all-namespaces --timeout=300s

      - name: End-to-end tests
        run: |
          export KUBECONFIG="${HOME}/.kube/config"
          make e2e

      - name: Runtime image checks
        run: make test-runtime
