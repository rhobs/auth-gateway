name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Go vet
        run: go vet ./...

      - name: Unit and golden tests
        run: make test

      - name: Compile tagged packages
        run: go test -tags=e2e,envoyruntime -run '^$' ./...

      - name: End-to-end tests
        run: make e2e
