# Version of the gateway configuration format.
version: 1

listener:
  # One Envoy listener port handles all configured protocols. Defaults to 8080.
  port: 8080

# Optional Envoy node metadata. Both values default to auth-gateway.
node:
  # Identifier for this Envoy instance.
  id: auth-gateway
  # Logical service cluster that this Envoy belongs to.
  cluster: auth-gateway

# Optional. Enabled by default. Set enabled to false to omit the collector and
# metrics Service port.
observability:
  metrics:
    # Optional. All metered APIs share this counter name. Envoy adds the
    # envoy_http_lua_ prefix; the collector removes it.
    custom_metric_name: gateway_http_requests_total
    enabled: true
    scrape_interval: 30s
    scrape_timeout: 10s
  # Optional. Envoy sends spans to the local collector, which exports them to
  # this OTLP/gRPC endpoint. Omit this section to leave tracing disabled.
  # tracing:
  #   enabled: true
  #   endpoint: otel-collector.observability.svc:4317
  #   service_name: auth-gateway
  #   sampling_percentage: 10
  #   # TLS is enabled by default. Set true for a trusted plaintext endpoint.
  #   # insecure: true

# Each API defines one upstream and one or more routes to it.
apis:
  - name: metrics-write
    metrics: {}
    upstream:
      address: thanos-receive
      port: 19291
    # Optional limits for this API's upstream cluster.
    # circuit_breakers:
    #   # Maximum upstream connections. Envoy default: 1024.
    #   max_connections: 1024
    #   # Maximum pending requests. Envoy default: 1024.
    #   max_pending_requests: 1024
    #   # Maximum parallel requests. Envoy default: 1024.
    #   max_requests: 1024
    #   # Maximum parallel retries. Default: 0.
    #   max_retries: 0
    routes:
      - methods: [POST]
        path:
          exact: /metrics/api/v1/receive
        rewrite:
          # Replace the complete request path with the upstream path.
          path: /api/v1/receive

  - name: metrics-query
    upstream:
      address: thanos-query
      port: 9090
    routes:
      # Routes are checked in declaration order. Put narrower matches first.
      # One safe regex route covers both query endpoints and keeps the suffix.
      - methods: [GET, POST]
        path:
          regex: '^/metrics/api/v1/(query|query_range)$'
        rewrite:
          regex:
            pattern: '^/metrics/(.*)$'
            substitution: '/\1'

      # Prefix matching forwards label names below this path.
      - methods: [GET]
        path:
          prefix: /metrics/api/v1/label/
        rewrite:
          prefix: /api/v1/label/

      - methods: [GET]
        path:
          exact: /metrics/api/v1/labels
        rewrite:
          path: /api/v1/labels

  - name: logs
    metrics: {}
    upstream:
      address: loki
      port: 3100
    routes:
      - methods: [POST]
        path:
          prefix: /logs/otlp/
        rewrite:
          prefix: /otlp/

servers:
  # Each exact hostname can appear only once.
  - hostname: write.auth.example.com
    # Omit tls_config to serve this hostname over plaintext HTTP.
    tls_config:
      secret: write-gateway-tls
      # Optional paths default to /etc/<secret>/tls.crt and tls.key.
      # certificate: /etc/write-gateway-tls/tls.crt
      # private_key: /etc/write-gateway-tls/tls.key
    # API bindings and routes are checked in declaration order.
    # Missing or empty bindings serve 404 for every path.
    apis: [metrics-write, logs]

  - hostname: query.auth.example.com
    tls_config:
      secret: query-gateway-tls
    apis: [metrics-query]

# Optional. Required when generating Kubernetes resources.
kubernetes:
  name: auth-gateway
  namespace: observability
  image: envoyproxy/envoy:v1.39.1
  # Optional. Defaults to the OpenTelemetry Collector image used by the PoC.
  otel_collector_image: otel/opentelemetry-collector-contrib:0.135.0
  replicas: 2
  # Optional Service port. Defaults to 80.
  # service_port: 80
  # Optional HTTPS Service port. Defaults to 443 when HTTPS servers are configured.
  # https_service_port: 443
  # Optional Envoy container resources. Omitted requests and limits use the defaults below.
  # Set a category to {} to omit its defaults.
  # resources:
  #   requests:
  #     cpu: 50m
  #     memory: 64Mi
  #   limits:
  #     cpu: "1"
  #     memory: 256Mi
