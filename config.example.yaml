# Full supported gateway configuration. Replace example hosts, upstreams, and
# resource names before use. Referenced Secrets and ConfigMaps must exist first.
version: 1

# Optional Envoy node identity. Both fields default to auth-gateway.
# node:
#   id: auth-gateway
#   cluster: auth-gateway

listener:
  port: 8080 # Default.
  # Optional listener settings; defaults shown.
  # per_connection_buffer_limit_bytes: 1048576
  # max_request_headers_kb: 32
  # max_request_headers_count: 100
  # request_headers_timeout: 5s
  # request_timeout: 30s
  # connection_idle_timeout: 1m
  # stream_idle_timeout: 1m
  # max_stream_duration: 30s
  # stream_flush_timeout: 5s
  # tls_handshake_timeout: 5s
  # Optional HTTP/2 overrides. Omitted fields use Envoy defaults.
  # http2:
  #   max_concurrent_streams: 1000
  #   initial_stream_window_size: 16777216
  #   initial_connection_window_size: 25165824

# Optional overload protection. It is disabled unless this section is set.
# Keep max_heap_bytes below the Envoy memory limit.
# overload:
#   max_heap_bytes: 201326592
#   max_downstream_connections: 2048
#   heap_shrink_threshold: 0.90 # Default.
#   request_reject_threshold: 0.95 # Default.

# Attributes use source values directly. Supply an extra source attribute when
# authorization and upstream headers need different values.
authenticators:
  - name: internal-jwt
    jwt:
      issuer: https://sso.internal.example.com/realms/observability
      jwks:
        uri: https://sso.internal.example.com/realms/observability/protocol/openid-connect/certs
        # Defaults to IPv4-only. Set V6_ONLY for IPv6-only egress networks.
        # dns_lookup_family: V6_ONLY
        # Defaults: cache_duration 5m, fetch_timeout 5s, connect_timeout 5s.
        # cache_duration: 5m
        # fetch_timeout: 5s
        # connect_timeout: 5s
        # Optional replacement trust bundle. Omit to use system CAs.
        # trusted_ca:
        #   config_map: {name: internal-issuer-ca, key: ca.crt}
        # Or, for file-based output without Kubernetes:
        # trusted_ca:
        #   filename: /etc/auth-gateway-ca/internal-issuer-ca.pem
        # Optional circuit breakers. Defaults are 1024, 1024, 1024, and 0.
        # circuit_breakers:
        #   max_connections: 1024
        #   max_pending_requests: 1024
        #   max_requests: 1024
        #   max_retries: 0
      audiences: [observability-ingestion]
    attributes:
      # jwt supports attributes from the request headers and the verified claims.
      # Claim values are lists of nested keys in the JWT payload.
      - name: tenant_id
        from_source: claim
        value: [organization, id]
      - name: writer_id
        from_source: claim
        value: [sub]
      - name: role
        from_source: claim
        value: [role]
      # A list-valued claim can be checked with has or has-one-of in a grant.
      # - name: groups
      #   from_source: claim
      #   value: [token, groups]
      - name: requested_tenant
        from_source: header
        value: X-Tenant

  - name: external-jwt
    jwt:
      issuer: https://sso.external.example.com/realms/observability
      jwks:
        uri: https://sso.external.example.com/realms/observability/protocol/openid-connect/certs
      audiences: [observability-ingestion]
    attributes:
      # jwt supports attributes from the request headers and verified claims.
      # Claim values are lists of nested keys in the JWT payload.
      - name: tenant_id
        from_source: claim
        value: [organization, id]
      - name: writer_id
        from_source: claim
        value: [sub]
      - name: role
        from_source: claim
        value: [role]
      - name: requested_tenant
        from_source: header
        value: X-Tenant

  - name: partner-key
    api_key:
      secret: auth-gateway-api-keys
      header: X-Partner-Key # Optional; defaults to X-API-Key.
    attributes:
      # api_key supports attributes from the request headers and the API key credential.
      - name: tenant_id
        from_source: credential
        value: tenant_id
      - name: key_id
        from_source: credential
        value: key_id
      - name: writer_id
        from_source: credential
        value: writer_id
      - name: requested_tenant
        from_source: header
        value: X-Tenant
      - name: role
        from_source: credential
        value: role

  - name: partner-cert
    mtls:
      # Client trust is required; there is no system CA fallback.
      trusted_ca:
        config_map: {name: partner-client-ca, key: ca.crt}
        # For file-based output, use filename: /etc/partner-client-ca.pem.
    attributes:
      # mtls supports attributes from the request headers and the client certificate SANs.
      - name: tenant_id
        from_source: certificate
        value: uri_san
      - name: writer_id
        from_source: certificate
        value: dns_san
      - name: requested_tenant
        from_source: header
        value: X-Tenant

# Optional gRPC Check service for access entries using authorization.ext_authz.
# Envoy verifies the service certificate, and forwards only listed headers.
ext_authz_services:
  - name: policy
    upstream:
      address: policy.observability.svc.cluster.local
      port: 9000
      http_protocol: http2
      tls_config:
        server_name: policy.observability.svc.cluster.local
        trusted_ca:
          config_map: {name: policy-ca, key: ca.pem}
    timeout: 300ms # Default.
    request_headers: [authorization, x-tenant]
    credential_headers: [authorization] # Remove before API upstream forwarding.
    attributes:
      - name: requested_tenant
        from_source: header
        value: X-Tenant
      - name: tenant_id
        from_source: authenticator
        value: tenant_id

# Metrics collection is enabled by default. Per-API counters still need
# apis[].metrics. Tracing is disabled by default.
observability:
  metrics:
    enabled: true # Default.
    # scrape_interval: 30s # Default.
    # scrape_timeout: 10s # Default.
    # custom_metric_name: auth_gateway_http_requests_total # Default.
  # tracing:
  #   enabled: true
  #   endpoint: otel-collector.observability.svc:4317 # Required when enabled.
  #   service_name: auth-gateway # Defaults to node.cluster.
  #   sampling_percentage: 100 # Default; range is 0 to 100.
  #   insecure: false # Default; true disables TLS to the collector.

apis:
  - name: metrics-write
    # Optional admission control for this API. Changes require a gateway rollout.
    admission_control:
      enabled: true
      sampling_window: 30s
      sr_threshold: 95
      rps_threshold: 10
      max_rejection_probability: 80
    # Optional per-API request counter. `api` is this API's name and
    # `http_status_code` comes from the response. Additional label names map to
    # authenticator attributes declared under authenticators[].attributes.
    # Injected errors count as standard requests with the same labels.
    # Choose bounded values; each label combination stays in Envoy until restart.
    # There is no cardinality limit. Use metrics: {} for API and status counts only.
    metrics:
      labels:
        tenant: tenant_id
        writer: writer_id
    # Optional HTTP error injection for SLO tests. Omit or leave disabled to
    # keep normal traffic. Enabling this requires a gateway rollout.
    fault_injection:
      enabled: false # Default.
      # Optional selectors. All headers and attributes must match. Attribute
      # values come from verified claims, credentials, or certificate SANs.
      # Omit match to make all authorized requests to this API eligible.
      match:
        headers:
          X-Inject-Fault: "true"
        attributes:
          tenant_id: [client-123]
      abort:
        http_status: 503
        percentage: 10 # Whole-number percentage of matching requests.
    upstream:
      address: thanos-receive
      port: 19291
      # connect_timeout: 5s # Default.
      # per_connection_buffer_limit_bytes: 1048576 # Default.
      # http_protocol: http1 # Default; set to http2 only if the backend supports it.
      # When using HTTP/2, optional connection overrides go here:
      # http_protocol: http2
      # http2:
      #   max_concurrent_streams: 1000
      #   initial_stream_window_size: 16777216
      #   initial_connection_window_size: 25165824
    # Optional API circuit breakers; defaults are 1024, 1024, 1024, and 0.
    # circuit_breakers:
    #   max_connections: 1024
    #   max_pending_requests: 1024
    #   max_requests: 1024
    #   max_retries: 0
    # Optional API timeouts. Response timeout defaults to 30s; idle and
    # maximum stream duration inherit from the listener.
    # timeouts:
    #   response_timeout: 30s
    #   idle_timeout: 1m
    #   max_stream_duration: 30s
    routes:
      - methods: [POST]
        path:
          exact: /metrics/api/v1/receive
        rewrite:
          path: /api/v1/receive
        processing:
          request_headers:
            - name: X-Scope-OrgID
              from_attribute: requested_tenant
            - name: X-Writer-ID
              from_attribute: writer_id
        # Optional per-route timeout overrides have the same fields as
        # API-level timeouts and take precedence over them.
        # timeouts:
        #   response_timeout: 20s

  - name: metrics-query
    admission_control:
      enabled: true
      sampling_window: 30s
      sr_threshold: 95
      rps_threshold: 10
      max_rejection_probability: 80
    upstream:
      address: thanos-query.observability.svc.cluster.local
      port: 9090
      tls_config:
        server_name: query.backend.example.com
        trusted_ca:
          config_map:
            name: backend-ca
            key: ca.crt
      # For a path already in the Envoy container, use trusted_ca.filename instead of config_map.
      # Upstream TLS is optional. Omit tls_config for plaintext HTTP.
    # Optional API-level timeout overrides. Omit to use the response and listener defaults.
    timeouts:
      response_timeout: 60s
      idle_timeout: 65s
      max_stream_duration: 90s
    routes:
      - methods: [GET, POST]
        path:
          regex: '^/metrics/api/v1/query$'
        rewrite:
          regex:
            pattern: '^/metrics/(.*)$'
            substitution: '/\1'
      - methods: [GET]
        path:
          prefix: /metrics/api/v1/label/
        rewrite:
          prefix: /api/v1/label/
      - methods: [GET]
        path:
          exact: /metrics/api/v1/labels
        rewrite:
          path: /api/v1/labels
      - methods: [GET, POST]
        path:
          exact: /metrics/api/v1/query_range
        rewrite:
          path: /api/v1/query_range
        timeouts:
          response_timeout: 90s
          idle_timeout: 95s
          max_stream_duration: 120s

  - name: logs
    admission_control:
      enabled: true
      sampling_window: 30s
      sr_threshold: 95
      rps_threshold: 10
      max_rejection_probability: 80
    metrics: {} # Count responses without attribute labels.
    upstream:
      address: loki
      port: 3100
    routes:
      - methods: [POST]
        path:
          prefix: /logs/otlp/
        rewrite:
          prefix: /otlp/
        processing:
          request_headers:
            - name: X-Scope-OrgID
              from_attribute: requested_tenant

servers:
  - hostname: metrics.example.com
    tls_config:
      secret: metrics-gateway-tls
    apis:
      - name: metrics-write
        access:
          # A concrete tenant keeps an external JWT grant with literal values.
          - tenant: client-123
            match:
              headers:
                - name: X-Tenant
                  expression: equals
                  value: client-123
                - name: X-Environment
                  expression: equals
                  value: production
            authentication:
              jwt:
                providers: [external-jwt]
            authorization:
              grants:
                - authenticator: external-jwt
                  attributes:
                    - name: tenant_id
                      expression: equals
                      value: organization-789
                    - name: role
                      expression: equals
                      value: writer

          # client-456 can use an internal JWT or a partner API key.
          - name: internal-writers
            match:
              headers:
                - name: X-Tenant
                  expression: in
                  value: [client-456, client-789]
                - name: X-Environment
                  expression: equals
                  value: production
                - name: Authorization
                  expression: present
            authentication:
              jwt:
                providers: [internal-jwt]
            authorization:
              grants:
                - authenticator: internal-jwt
                  attributes:
                    - name: tenant_id
                      expression: equals-attribute
                      value: requested_tenant
                    - name: role
                      expression: equals
                      value: writer
                    # - name: groups
                    #   expression: has-one-of
                    #   value: [metrics-writers, metrics-admins]

          # Presence selectors keep the shared tenant's access entries distinct.
          - name: partner-writers
            match:
              headers:
                - name: X-Tenant
                  expression: in
                  value: [client-456, customer-123, customer-456]
                - name: X-Environment
                  expression: equals
                  value: production
                - name: X-Partner-Key
                  expression: present
            authentication:
              api_key:
                authenticator: partner-key
            authorization:
              grants:
                - authenticator: partner-key
                  attributes:
                    - name: tenant_id
                      expression: equals-attribute
                      value: requested_tenant
                    - name: writer_id
                      expression: in
                      value: [agent-17, agent-18]
                    - name: role
                      expression: equals
                      value: writer

      - name: metrics-query
        access:
          # Both tenants share the same providers and permission rules.
          - name: readers
            match:
              headers:
                - name: X-Tenant
                  expression: in
                  value: [client-123, customer-456]
                - name: X-Environment
                  expression: equals
                  value: production
            authentication:
              jwt:
                providers: [internal-jwt, external-jwt]
            authorization:
              grants:
                - authenticator: internal-jwt
                  attributes:
                    - name: tenant_id
                      expression: equals-attribute
                      value: requested_tenant
                    - name: role
                      expression: in
                      value: [reader, admin]
                - authenticator: external-jwt
                  attributes:
                    - name: tenant_id
                      expression: equals-attribute
                      value: requested_tenant
                    - name: role
                      expression: in
                      value: [viewer]

  # The same query API has a narrower issuer set on this hostname.
      - name: logs
        access:
          - name: log-writers
            match:
              headers:
                - name: X-Tenant
                  expression: in
                  value: [client-123, customer-456]
                - name: X-Environment
                  expression: equals
                  value: production
            authentication:
              jwt:
                providers: [internal-jwt, external-jwt]
            authorization:
              grants:
                - authenticator: internal-jwt
                  attributes:
                    - name: tenant_id
                      expression: equals-attribute
                      value: requested_tenant
                    - name: role
                      expression: in
                      value: [writer]
                - authenticator: external-jwt
                  attributes:
                    - name: tenant_id
                      expression: equals-attribute
                      value: requested_tenant
                    - name: role
                      expression: in
                      value: [writer]

  - hostname: internal-query.example.com
    tls_config:
      secret: metrics-gateway-tls
    apis:
      - name: metrics-query
        access:
          - name: internal-readers
            match:
              headers:
                - name: X-Tenant
                  expression: in
                  value: [client-123, client-456]
                - name: X-Environment
                  expression: equals
                  value: production
            authentication:
              jwt:
                providers: [internal-jwt]
            authorization:
              grants:
                - authenticator: internal-jwt
                  attributes:
                    - name: tenant_id
                      expression: equals-attribute
                      value: requested_tenant
                    - name: role
                      expression: in
                      value: [reader, admin]

  # Local JWT verification can precede external authorization. An entry with
  # no local authentication lets the policy service do both jobs.
  - hostname: policy-query.example.com
    tls_config:
      secret: policy-query-gateway-tls
    apis:
      - name: metrics-query
        access:
          - name: internal-policy
            match:
              headers:
                - name: X-Tenant
                  expression: equals
                  value: client-123
            authentication:
              jwt: {providers: [internal-jwt]}
            authorization:
              ext_authz:
                service: policy
          - name: partner-policy
            match:
              headers:
                - name: X-Tenant
                  expression: equals
                  value: customer-456
            authorization:
              ext_authz:
                service: policy

  # Client certificates are mandatory for this server's entire API set.
  - hostname: mtls-write.example.com
    tls_config:
      secret: mtls-write-gateway-tls
      mtls:
        authenticator: partner-cert
    apis:
      - name: metrics-write
        access:
          - tenant: customer-456
            match:
              headers:
                - name: X-Tenant
                  expression: equals
                  value: customer-456
                - name: X-Environment
                  expression: equals
                  value: production
            # Authentication is inherited; any API-level auth is a config error.
            authorization:
              grants:
                - authenticator: partner-cert
                  attributes:
                    - name: tenant_id
                      expression: equals
                      value: spiffe://partners.example.com/customer-456
                    - name: writer_id
                      expression: equals
                      value: writer-17.partners.example.com


# Public APIs require an explicit public binding and no access entries.
# - hostname: public.example.com
#   apis:
#     - name: metrics-query
#       public: true

kubernetes:
  name: auth-gateway # Also identifies this gateway in Pod and Service selectors.
  namespace: observability
  image: "" # Empty or omitted uses gateway.DefaultEnvoyImage.
  otel_collector_image: "" # Empty or omitted uses gateway.DefaultOTelCollectorImage.
  replicas: 2 # Default.
  # service_port: 80 # Default.
  # https_service_port: 443 # Default when an HTTPS server exists.
  # envoy_concurrency: 2 # Optional; omitted lets Envoy choose workers.
  # Omit these maps to use defaults. Set a map to {} to omit that category.
  # resources:
  #   requests:
  #     cpu: 50m
  #     memory: 64Mi
  #   limits:
  #     cpu: "1"
  #     memory: 256Mi
  # metrics:
  #   resources:
  #     requests:
  #       cpu: 20m
  #       memory: 64Mi
  #     limits:
  #       memory: 256Mi # No CPU limit by default.
