version: 1

admission_control:
  enabled: true
  sampling_window: 45s
  sr_threshold: 91.5
  rps_threshold: 25
  max_rejection_probability: 65

servers:
  - hostname: admission.test
    apis: [protected, plain]

apis:
  - name: protected
    upstream:
      address: httpbin
      port: 8080
    routes:
      - methods: [GET]
        path:
          prefix: /protected/

  - name: plain
    upstream:
      address: httpbin
      port: 8080
    routes:
      - methods: [GET]
        path:
          prefix: /plain/

kubernetes:
  name: auth-gateway
  namespace: gateway-test
