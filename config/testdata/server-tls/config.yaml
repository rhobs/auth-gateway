version: 1
servers:
  - hostname: auth.example.com
    apis: [metrics]
  - hostname: tls.example.com
    tls_config:
      secret: auth-gateway-tls
    apis: [metrics]
  - hostname: query.example.com
    tls_config:
      secret: query-gateway-tls
    apis: []
apis:
  - name: metrics
    upstream:
      address: thanos-receive
      port: 19291
    routes:
      - methods: [POST]
        path:
          exact: /metrics/api/v1/receive
        rewrite:
          path: /api/v1/receive
kubernetes:
  name: auth-gateway
  namespace: observability
  image: envoyproxy/envoy:v1.39.1
