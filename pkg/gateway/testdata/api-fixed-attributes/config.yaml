version: 1
apis:
- name: metrics
  attributes:
  - name: role
    from:
      fixed: "metrics:read"
  - name: api
    from:
      fixed: metrics
  metrics:
    labels:
      operation: {from: {attribute: role}}
  upstream:
    address: metrics.example.test
    port: 8080
  routes:
  - methods: [GET]
    path: {expression: equals, value: /metrics}
    processing:
      request_headers:
      - name: X-Operation
        from: {attribute: role}
- name: plain
  upstream:
    address: plain.example.test
    port: 8080
  routes:
  - methods: [GET]
    path: {expression: equals, value: /plain}
servers:
- hostname: gateway.example.test
  apis:
  - name: metrics
    public: true
  - name: plain
    public: true
kubernetes:
  name: auth-gateway
  namespace: observability
