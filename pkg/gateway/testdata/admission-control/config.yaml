---
version: 1
servers:
- hostname: admission.test
  apis:
  - name: protected
    public: true
  - name: other
    public: true
  - name: plain
    public: true
  - name: disabled
    public: true
- hostname: shared.admission.test
  apis:
  - name: protected
    public: true
- hostname: secure.admission.test
  tls_config:
    secret: admission-tls
  apis:
  - name: other
    public: true
- hostname: plain.admission.test
  tls_config:
    secret: admission-tls
  apis:
  - name: plain
    public: true
  - name: disabled
    public: true
apis:
- name: protected
  admission_control:
    enabled: true
    sampling_window: 45s
    sr_threshold: 91.5
    rps_threshold: 25
    max_rejection_probability: 65
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    - POST
    path:
      prefix: "/protected/"
  - methods:
    - GET
    path:
      exact: "/protected-status"
- name: other
  admission_control:
    enabled: true
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    path:
      prefix: "/other/"
- name: plain
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    path:
      prefix: "/plain/"
- name: disabled
  admission_control:
    sampling_window: 1m
    sr_threshold: 90
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    path:
      prefix: "/disabled/"
kubernetes:
  name: auth-gateway
  namespace: gateway-test
