---
version: 1
authenticators:
- name: issuer-one
  jwt:
    issuer: https://issuer-one.jwt.test
    jwks:
      uri: https://jwks.jwt.test/issuer-one
    audiences:
    - gateway-test
  attributes:
    tenant_id:
      claim_path:
      - organization
      - id
    requested_tenant:
      header: X-Tenant
- name: client-cert
  mtls:
    trusted_ca:
      config_map:
        name: gateway-client-ca
        key: ca.crt
  attributes:
    tenant_id:
      uri_san: true
    dns_id:
      dns_san: true
    requested_tenant:
      header: X-Tenant
- name: partner-key
  api_key:
    secret: gateway-api-keys
    header: X-Partner-Key
  attributes:
    tenant_id:
      credential: true
    requested_tenant:
      header: X-Tenant
apis:
- name: ingest
  metrics:
    labels:
      tenant: tenant_id
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - POST
    path:
      exact: "/ingest"
    rewrite:
      path: "/anything"
    processing:
      request_headers:
      - name: X-Scope-OrgID
        from_attribute: tenant_id
servers:
- hostname: mtls.gateway.test
  tls_config:
    secret: gateway-tls
    mtls:
      authenticator: client-cert
  apis:
  - name: ingest
    access:
    - name: default
      authorization:
        grants:
        - authenticator: client-cert
          attributes:
            tenant_id:
            - spiffe://clients.example.test/client-a
            dns_id:
            - client-a.example.test
- hostname: trust.gateway.test
  tls_config:
    secret: gateway-tls
    mtls:
      authenticator: client-cert
  apis:
  - name: ingest
    access:
    - name: default
      authorization:
        grants:
        - authenticator: client-cert
          attributes: {}
kubernetes:
  name: auth-gateway
  namespace: gateway-test
