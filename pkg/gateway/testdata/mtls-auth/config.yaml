---
version: 1
authenticators:
- name: issuer-one
  jwt:
    issuer: https://issuer-one.jwt.test
    jwks:
      uri: https://jwks.jwt.test/issuer-one
    audiences:
    - gateway-test
  attributes:
    - name: tenant_id
      from_source: claim
      value: [organization, id]
    - name: requested_tenant
      from_source: header
      value: X-Tenant
- name: client-cert
  mtls:
    trusted_ca:
      config_map:
        name: gateway-client-ca
        key: ca.crt
  attributes:
    - name: tenant_id
      from_source: certificate
      value: uri_san
    - name: dns_id
      from_source: certificate
      value: dns_san
    - name: requested_tenant
      from_source: header
      value: X-Tenant
- name: partner-key
  api_key:
    secret: gateway-api-keys
    header: X-Partner-Key
  attributes:
    - name: tenant_id
      from_source: credential
      value: tenant_id
    - name: requested_tenant
      from_source: header
      value: X-Tenant
apis:
- name: ingest
  metrics:
    labels:
      tenant: tenant_id
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - POST
    path:
      exact: "/ingest"
    rewrite:
      path: "/anything"
    processing:
      request_headers:
      - name: X-Scope-OrgID
        from_attribute: tenant_id
servers:
- hostname: mtls.gateway.test
  tls_config:
    secret: gateway-tls
    mtls:
      authenticator: client-cert
  apis:
  - name: ingest
    access:
    - name: default
      authorization:
        grants:
        - authenticator: client-cert
          attributes:
            - name: tenant_id
              expression: equals
              value: spiffe://clients.example.test/client-a
            - name: dns_id
              expression: equals
              value: client-a.example.test
- hostname: trust.gateway.test
  tls_config:
    secret: gateway-tls
    mtls:
      authenticator: client-cert
  apis:
  - name: ingest
    access:
    - name: default
      authorization:
        grants:
        - authenticator: client-cert
          attributes: []
kubernetes:
  name: auth-gateway
  namespace: gateway-test
