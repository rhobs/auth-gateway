---
version: 1
servers:
- hostname: auth.example.com
  apis:
  - name: metrics
    public: true
apis:
- name: metrics
  upstream:
    address: thanos-receive
    port: 19291
  routes:
  - methods:
    - POST
    path:
      exact: "/metrics/api/v1/receive"
observability:
  metrics:
    enabled:
    scrape_interval:
    scrape_timeout:
kubernetes:
  name: auth-gateway
  namespace: observability
  metrics:
    resources:
      requests:
      limits:
overload:
