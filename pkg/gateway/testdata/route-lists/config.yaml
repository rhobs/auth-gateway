---
version: 1
servers:
- hostname: query.example.com
  apis:
  - name: metrics-query
    public: true
apis:
- name: metrics-query
  upstream:
    address: thanos-query
    port: 9090
  routes:
  - methods:
    - GET
    - POST
    path:
      expression: regex
      value: "^/metrics/api/v1/(query|query_range)$"
    rewrite:
      regex:
        pattern: "^/metrics/(.*)$"
        substitution: "/\\1"
  - methods:
    - GET
    path:
      expression: prefix
      value: "/metrics/api/v1/label/"
    rewrite:
      prefix: "/api/v1/label/"
  - methods:
    - GET
    path:
      expression: equals
      value: "/metrics/api/v1/labels"
    rewrite:
      path: "/api/v1/labels"
kubernetes:
  name: auth-gateway
  namespace: observability
