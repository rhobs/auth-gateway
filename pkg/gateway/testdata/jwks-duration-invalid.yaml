---
version: 1
authenticators:
- name: internal-jwt
  jwt:
    issuer: https://issuer.example.test
    jwks:
      uri: https://issuer.example.test/jwks
      fetch_timeout: 500us
    audiences:
    - gateway-test
  attributes:
    - name: tenant_id
      from:
        claim: [tenant]
servers:
- hostname: gateway.example.test
  apis:
  - name: metrics
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - internal-jwt
      authorization:
        grants:
        - authenticator: internal-jwt
          match:
            attributes:
              - name: tenant_id
                expression: equals
                value: client-a
apis:
- name: metrics
  upstream:
    address: backend.example.test
    port: 8080
  routes:
  - methods:
    - POST
    path:
      expression: equals
      value: "/write"
