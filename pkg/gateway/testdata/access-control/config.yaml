version: 1
authenticators:
  - name: issuer-one
    jwt:
      issuer: https://issuer-one.access.test
      jwks: {uri: https://issuer-one.access.test/keys}
      audiences: [access-test]
    attributes:
      - name: tenant_id
        from_source: claim
        value: [tenant]
      - name: role
        from_source: claim
        value: [role]
      - name: requested_tenant
        from_source: header
        value: X-Tenant
  - name: issuer-two
    jwt:
      issuer: https://issuer-two.access.test
      jwks: {uri: https://issuer-two.access.test/keys}
      audiences: [access-test]
    attributes:
      - name: tenant_id
        from_source: claim
        value: [organization, id]
      - name: role
        from_source: claim
        value: [access, role]
      - name: requested_tenant
        from_source: header
        value: X-Tenant
  - name: writer-key
    api_key: {secret: access-test-keys, header: X-Writer-Key}
    attributes:
      - name: tenant_id
        from_source: credential
        value: tenant_id
      - name: role
        from_source: credential
        value: role
      - name: requested_tenant
        from_source: header
        value: X-Tenant
  - name: writer-cert
    mtls:
      trusted_ca:
        config_map: {name: access-test-client-ca, key: ca.crt}
    attributes:
      - name: tenant_id
        from_source: certificate
        value: uri_san
      - name: writer_id
        from_source: certificate
        value: dns_san
      - name: requested_tenant
        from_source: header
        value: X-Tenant
apis:
  - name: write
    upstream: {address: httpbin, port: 8080}
    metrics: {}
    routes:
      - methods: [POST]
        path: {exact: /write}
        rewrite: {path: /anything}
        processing:
          request_headers:
            - {name: X-Scope-OrgID, from_attribute: requested_tenant}
  - name: read
    upstream: {address: httpbin, port: 8080}
    metrics: {}
    routes:
      - methods: [GET]
        path: {exact: /read}
        rewrite: {path: /anything}
        processing:
          request_headers:
            - {name: X-Scope-OrgID, from_attribute: requested_tenant}
  - name: health
    upstream: {address: httpbin, port: 8080}
    routes:
      - methods: [GET]
        path: {exact: /health}
servers:
  - hostname: gateway.access.test
    apis:
      - name: write
        access:
          - name: jwt-writers
            match:
              headers:
                - name: X-Tenant
                  expression: in
                  value: [tenant-a, tenant-b]
                - name: X-Mode
                  expression: equals
                  value: write
            authentication:
              jwt: {providers: [issuer-one]}
            authorization:
              grants:
                - authenticator: issuer-one
                  attributes:
                    - name: tenant_id
                      expression: equals-attribute
                      value: requested_tenant
                    - name: role
                      expression: equals
                      value: writer
          - name: key-writers
            match:
              headers:
                - name: X-Tenant
                  expression: equals
                  value: partner-a
                - name: X-Mode
                  expression: equals
                  value: write
            authentication:
              api_key: {authenticator: writer-key}
            authorization:
              grants:
                - authenticator: writer-key
                  attributes:
                    - name: tenant_id
                      expression: equals-attribute
                      value: requested_tenant
                    - name: role
                      expression: equals
                      value: writer
      - name: read
        access:
          - name: readers
            match:
              headers:
                - name: X-Tenant
                  expression: in
                  value: [tenant-a, tenant-b]
                - name: X-Mode
                  expression: equals
                  value: read
            authentication:
              jwt: {providers: [issuer-one, issuer-two]}
            authorization:
              grants:
                - authenticator: issuer-one
                  attributes:
                    - name: tenant_id
                      expression: equals-attribute
                      value: requested_tenant
                    - name: role
                      expression: equals
                      value: reader
                - authenticator: issuer-two
                  attributes:
                    - name: tenant_id
                      expression: equals-attribute
                      value: requested_tenant
                    - name: role
                      expression: equals
                      value: viewer
      - name: health
        public: true
  - hostname: cert.access.test
    tls_config:
      secret: access-test-tls
      mtls: {authenticator: writer-cert}
    apis:
      - name: write
        access:
          - tenant: partner-a
            match:
              headers:
                - name: X-Tenant
                  expression: equals
                  value: partner-a
                - name: X-Mode
                  expression: equals
                  value: write
            authorization:
              grants:
                - authenticator: writer-cert
                  attributes:
                    - name: tenant_id
                      expression: equals
                      value: 'spiffe://writers.access.test/partner-a'
                    - name: writer_id
                      expression: equals
                      value: writer-1.access.test
kubernetes:
  name: access-test
  namespace: gateway-test
