version: 1
authenticators:
- name: internal-jwt
  jwt:
    issuer: https://issuer.example.test
    jwks:
      uri: https://issuer.example.test/jwks
  attributes:
    tenant_id: {claim_path: [tenant]}
ext_authz_services:
- name: policy
  upstream:
    address: policy.example.test
    port: 9000
    http_protocol: http2
    tls_config:
      server_name: policy.example.test
  timeout: 300ms
  request_headers: [authorization, x-tenant]
  credential_headers: [authorization]
apis:
- name: metrics
  upstream:
    address: thanos-receive
    port: 19291
  routes:
  - methods: [GET]
    path: {exact: /protected}
    rewrite: {path: /anything}
    processing:
      request_headers:
      - name: X-Scope-OrgID
        from_attribute: requested_tenant
servers:
- hostname: writer.example.test
  apis:
  - name: metrics
    access:
    - name: jwt
      match:
        headers:
          X-Tenant: {exact: internal}
      authentication:
        jwt: {providers: [internal-jwt]}
      authorization:
        ext_authz:
          service: policy
          response_attributes:
            requested_tenant: [identity, tenant]
    - name: external
      match:
        headers:
          X-Tenant: {exact: partner}
      authorization:
        ext_authz:
          service: policy
          response_attributes:
            requested_tenant: [identity, tenant]
kubernetes:
  name: auth-gateway
  namespace: observability
