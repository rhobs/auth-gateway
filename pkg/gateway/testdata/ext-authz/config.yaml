version: 1
authenticators:
- name: internal-jwt
  jwt:
    issuer: https://issuer.example.test
    jwks:
      uri: https://issuer.example.test/jwks
  attributes:
  - name: tenant_id
    from_source: claim
    value: [tenant]
  - name: auth_origin
    from_source: fixed
    value: "jwt (100%)"
ext_authz_services:
- name: policy
  upstream:
    address: policy.example.test
    port: 9000
    http_protocol: http2
    tls_config:
      server_name: policy.example.test
  timeout: 300ms
  request_headers: [authorization, x-tenant]
  credential_headers: [authorization]
  attributes:
  - name: requested_tenant
    from_source: header
    value: X-Tenant
  - name: tenant_id
    from_source: authenticator
    value: tenant_id
  - name: auth_origin
    from_source: authenticator
    value: auth_origin
apis:
- name: metrics
  upstream:
    address: thanos-receive
    port: 19291
  routes:
  - methods: [GET]
    path: {exact: /protected}
    rewrite: {path: /anything}
    processing:
      request_headers:
      - name: X-Scope-OrgID
        from_attribute: requested_tenant
servers:
- hostname: writer.example.test
  apis:
  - name: metrics
    access:
    - name: jwt
      match:
        headers:
        - name: X-Tenant
          expression: equals
          value: internal
      authentication:
        jwt: {providers: [internal-jwt]}
      authorization:
        ext_authz:
          service: policy
    - name: external
      match:
        headers:
        - name: X-Tenant
          expression: equals
          value: partner
      authorization:
        ext_authz:
          service: policy
kubernetes:
  name: auth-gateway
  namespace: observability
