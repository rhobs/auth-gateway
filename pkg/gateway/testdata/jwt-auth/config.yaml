---
version: 1
authenticators:
- name: internal-jwt
  jwt:
    issuer: https://issuer-one.jwt.test
    jwks:
      uri: https://issuer-one.jwt.test/jwks
    audiences:
    - gateway-test
  attributes:
    - name: tenant_id
      from_source: claim
      value: [organization, id]
apis:
- name: metrics
  upstream:
    address: thanos-receive
    port: 19291
  routes:
  - methods:
    - GET
    path:
      exact: "/protected"
    rewrite:
      path: "/anything"
servers:
- hostname: writer.jwt.example.test
  apis:
  - name: metrics
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - internal-jwt
      authorization:
        grants:
        - authenticator: internal-jwt
          attributes:
            - name: tenant_id
              expression: equals
              value: customer-a
kubernetes:
  name: auth-gateway
  namespace: observability
