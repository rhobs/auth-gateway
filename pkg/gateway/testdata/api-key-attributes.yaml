    - name: attribute19
      from_source: credential
      value: attribute19
    - name: requested_tenant
      from_source: header
      value: X-Scope-OrgID
apis:
- name: ingest
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - POST
    path:
      exact: "/ingest"
    rewrite:
      path: "/anything"
    processing:
      request_headers:
      - name: X-Attribute00
        from_attribute: attribute00
      - name: X-Attribute01
        from_attribute: attribute01
      - name: X-Attribute02
        from_attribute: attribute02
      - name: X-Attribute03
        from_attribute: attribute03
      - name: X-Attribute04
        from_attribute: attribute04
      - name: X-Attribute05
        from_attribute: attribute05
      - name: X-Attribute06
        from_attribute: attribute06
      - name: X-Attribute07
        from_attribute: attribute07
      - name: X-Attribute08
        from_attribute: attribute08
      - name: X-Attribute09
        from_attribute: attribute09
      - name: X-Attribute10
        from_attribute: attribute10
      - name: X-Attribute11
        from_attribute: attribute11
      - name: X-Attribute12
        from_attribute: attribute12
      - name: X-Attribute13
        from_attribute: attribute13
      - name: X-Attribute14
        from_attribute: attribute14
      - name: X-Attribute15
        from_attribute: attribute15
      - name: X-Attribute16
        from_attribute: attribute16
      - name: X-Attribute17
        from_attribute: attribute17
      - name: X-Attribute18
        from_attribute: attribute18
      - name: X-Attribute19
        from_attribute: attribute19
servers:
- hostname: key.runtime.test
  apis:
  - name: ingest
    access:
    - name: default
      match:
        headers:
          - name: X-Scope-OrgID
            expression: equals
            value: caller-controlled
      authentication:
        api_key:
          authenticator: partner-key
      authorization:
        grants:
        - authenticator: partner-key
          attributes:
            - name: attribute00
              expression: equals
              value: value00
