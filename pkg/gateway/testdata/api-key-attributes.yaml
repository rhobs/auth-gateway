---
version: 1
authenticators:
- name: partner-key
  api_key:
    header: X-Partner-Key
  attributes:
    - name: attribute00
      from_source: credential
      value: attribute00
    - name: attribute01
      from_source: credential
      value: attribute01
    - name: attribute02
      from_source: credential
      value: attribute02
    - name: attribute03
      from_source: credential
      value: attribute03
    - name: attribute04
      from_source: credential
      value: attribute04
    - name: attribute05
      from_source: credential
      value: attribute05
    - name: attribute06
      from_source: credential
      value: attribute06
    - name: attribute07
      from_source: credential
      value: attribute07
    - name: attribute08
      from_source: credential
      value: attribute08
    - name: attribute09
      from_source: credential
      value: attribute09
    - name: attribute10
