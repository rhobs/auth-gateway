---
version: 1
authenticators:
- name: partner-key
  api_key:
    header: X-Partner-Key
  attributes:
    - name: attribute00
      from:
        credential: attribute00
    - name: attribute01
      from:
        credential: attribute01
    - name: attribute02
      from:
        credential: attribute02
    - name: attribute03
      from:
        credential: attribute03
    - name: attribute04
      from:
        credential: attribute04
    - name: attribute05
      from:
        credential: attribute05
    - name: attribute06
      from:
        credential: attribute06
    - name: attribute07
      from:
        credential: attribute07
    - name: attribute08
      from:
        credential: attribute08
    - name: attribute09
      from:
        credential: attribute09
    - name: attribute10
      from:
        credential: attribute10
    - name: attribute11
      from:
        credential: attribute11
    - name: attribute12
      from:
        credential: attribute12
    - name: attribute13
      from:
        credential: attribute13
    - name: attribute14
      from:
        credential: attribute14
    - name: attribute15
      from:
        credential: attribute15
    - name: attribute16
      from:
        credential: attribute16
    - name: attribute17
      from:
        credential: attribute17
    - name: attribute18
      from:
        credential: attribute18
    - name: attribute19
      from:
        credential: attribute19
    - name: requested_tenant
      from:
        header: X-Scope-OrgID
apis:
- name: ingest
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - POST
    path:
      expression: equals
      value: "/ingest"
    rewrite:
      path: "/anything"
    processing:
      request_headers:
      - name: X-Attribute00
        from: {attribute: attribute00}
      - name: X-Attribute01
        from: {attribute: attribute01}
      - name: X-Attribute02
        from: {attribute: attribute02}
      - name: X-Attribute03
        from: {attribute: attribute03}
      - name: X-Attribute04
        from: {attribute: attribute04}
      - name: X-Attribute05
        from: {attribute: attribute05}
      - name: X-Attribute06
        from: {attribute: attribute06}
      - name: X-Attribute07
        from: {attribute: attribute07}
      - name: X-Attribute08
        from: {attribute: attribute08}
      - name: X-Attribute09
        from: {attribute: attribute09}
      - name: X-Attribute10
        from: {attribute: attribute10}
      - name: X-Attribute11
        from: {attribute: attribute11}
      - name: X-Attribute12
        from: {attribute: attribute12}
      - name: X-Attribute13
        from: {attribute: attribute13}
      - name: X-Attribute14
        from: {attribute: attribute14}
      - name: X-Attribute15
        from: {attribute: attribute15}
      - name: X-Attribute16
        from: {attribute: attribute16}
      - name: X-Attribute17
        from: {attribute: attribute17}
      - name: X-Attribute18
        from: {attribute: attribute18}
      - name: X-Attribute19
        from: {attribute: attribute19}
servers:
- hostname: key.runtime.test
  apis:
  - name: ingest
    access:
    - name: default
      match:
        headers:
          - name: X-Scope-OrgID
            expression: equals
            value: caller-controlled
      authentication:
        api_key:
          authenticator: partner-key
      authorization:
        grants:
        - authenticator: partner-key
          match:
            attributes:
              - name: attribute00
                expression: equals
                value: value00
