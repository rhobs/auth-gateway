---
version: 1
authenticators:
- name: issuer-one
  jwt:
    issuer: https://issuer-one.jwt.test
    jwks:
      uri: https://issuer-one.jwt.test/jwks
    audiences:
    - gateway-test
  attributes:
    tenant_id:
      claim_path:
      - organization
      - id
- name: issuer-two
  jwt:
    issuer: https://issuer-two.jwt.test
    jwks:
      uri: https://issuer-two.jwt.test/jwks
      dns_lookup_family: V6_ONLY
    audiences:
    - gateway-test
  attributes:
    tenant_id:
      claim_path:
      - organization
      - id
apis:
- name: metrics
  upstream:
    address: thanos-receive
    port: 19291
  routes:
  - methods:
    - GET
    path:
      exact: "/protected"
    rewrite:
      path: "/anything"
servers:
- hostname: writer.jwt.example.test
  apis:
  - name: metrics
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - issuer-one
          - issuer-two
      authorization:
        grants:
        - authenticator: issuer-one
          attributes:
            tenant_id:
            - customer-a
        - authenticator: issuer-two
          attributes:
            tenant_id:
            - customer-b
- hostname: issuer-one.jwt.example.test
  apis:
  - name: metrics
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - issuer-one
      authorization:
        grants:
        - authenticator: issuer-one
          attributes:
            tenant_id:
            - customer-a
kubernetes:
  name: auth-gateway
  namespace: observability
