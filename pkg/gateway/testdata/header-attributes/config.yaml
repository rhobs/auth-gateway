---
version: 1
authenticators:
- name: issuer-one
  jwt:
    issuer: https://issuer-one.jwt.test
    jwks:
      uri: https://issuer-one.jwt.test/jwks
    audiences:
    - gateway-test
  attributes:
    - name: tenant_id
      from:
        claim: [organization, id]
    - name: requested_tenant
      from:
        header: X-Tenant
- name: partner-key
  api_key:
    secret: gateway-api-keys
    header: X-Partner-Key
  attributes:
    - name: tenant_id
      from:
        credential: tenant_id
    - name: requested_tenant
      from:
        header: X-Tenant
apis:
- name: ingest
  metrics:
    labels:
      tenant: {from: {attribute: requested_tenant}}
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - POST
    path:
      expression: equals
      value: "/ingest"
    rewrite:
      path: "/anything"
    processing:
      request_headers:
      - name: X-Scope-OrgID
        from: {attribute: requested_tenant}
servers:
- hostname: jwt.headers.test
  apis:
  - name: ingest
    access:
    - name: writers
      match:
        headers:
          - name: X-Tenant
            expression: in
            value: [client-a, client-b]
      authentication:
        jwt: {providers: [issuer-one]}
      authorization:
        grants:
        - authenticator: issuer-one
          match:
            attributes:
              - name: tenant_id
                expression: equals
                value_from:
                  attribute: requested_tenant
- hostname: key.headers.test
  apis:
  - name: ingest
    access:
    - name: writers
      match:
        headers:
          - name: X-Tenant
            expression: in
            value: [client-a, client-b]
      authentication:
        api_key: {authenticator: partner-key}
      authorization:
        grants:
        - authenticator: partner-key
          match:
            attributes:
              - name: tenant_id
                expression: equals
                value_from:
                  attribute: requested_tenant
kubernetes:
  name: auth-gateway
  namespace: gateway-test
