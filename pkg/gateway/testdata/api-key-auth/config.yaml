---
version: 1
authenticators:
- name: issuer-one
  jwt:
    issuer: https://issuer-one.jwt.test
    jwks:
      uri: https://jwks.jwt.test/issuer-one
    audiences:
    - gateway-test
  attributes:
    tenant_id:
      claim_path:
      - organization
      - id
    writer_id:
      claim_path:
      - sub
- name: partner-key
  api_key:
    secret: gateway-api-keys
    header: X-Partner-Key
  attributes:
    tenant_id:
      credential: true
    writer_id:
      credential: true
observability:
  metrics:
    custom_metric_name: gateway_http_requests_total
apis:
- name: ingest
  metrics:
    labels:
      tenant: tenant_id
      writer: writer_id
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - POST
    path:
      exact: "/ingest"
    rewrite:
      path: "/anything"
    processing:
      request_headers:
      - name: X-Scope-OrgID
        from_attribute: tenant_id
      - name: X-Writer-ID
        from_attribute: writer_id
- name: public
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    path:
      exact: "/health"
    rewrite:
      path: "/anything"
servers:
- hostname: public.gateway.test
  apis:
  - name: public
    public: true
- hostname: key.gateway.test
  apis:
  - name: ingest
    access:
    - name: default
      authentication:
        api_key:
          authenticator: partner-key
      authorization:
        grants:
        - authenticator: partner-key
          attributes:
            tenant_id:
            - client-a
- hostname: mixed.gateway.test
  apis:
  - name: ingest
    access:
    - name: path-0
      match:
        headers:
          X-Auth-Path:
            exact: jwt
      authentication:
        jwt:
          providers:
          - issuer-one
      authorization:
        grants:
        - authenticator: issuer-one
          attributes:
            tenant_id:
            - client-a
    - name: path-1
      match:
        headers:
          X-Auth-Path:
            exact: api_key
      authentication:
        api_key:
          authenticator: partner-key
      authorization:
        grants:
        - authenticator: partner-key
          attributes:
            tenant_id:
            - client-a
kubernetes:
  name: auth-gateway
  namespace: gateway-test
