---
version: 1
servers:
- hostname: fault.example.com
  apis:
  - name: injected
    public: true
    fault_injection:
      enabled: true
      abort:
        http_status: 503
        percentage: 25
  - name: healthy
    public: true
apis:
- name: injected
  metrics: {}
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    - POST
    path:
      prefix: "/injected/"
- name: healthy
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    path:
      prefix: "/healthy/"
kubernetes:
  name: auth-gateway
  namespace: gateway-test
