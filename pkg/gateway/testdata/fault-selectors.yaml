---
version: 1
authenticators:
- name: issuer-one
  jwt:
    issuer: https://issuer-one.jwt.test
    jwks:
      uri: https://jwks.jwt.test/issuer-one
    audiences:
    - gateway-test
  attributes:
    - name: tenant_id
      from:
        claim: [organization, id]
    - name: writer_id
      from:
        claim: [sub]
    - name: requested_tenant
      from:
        header: X-Tenant
- name: partner-key
  api_key:
    secret: gateway-api-keys
    header: X-Partner-Key
  attributes:
    - name: tenant_id
      from:
        credential: tenant_id
    - name: writer_id
      from:
        credential: writer_id
    - name: requested_tenant
      from:
        header: X-Tenant
servers:
- hostname: fault.example.com
  apis:
  - name: injected
    fault_injection:
      enabled: true
      match:
        headers:
        - name: X-Inject-Fault
          expression: equals
          value: 'true'
        attributes:
        - name: tenant_id
          expression: in
          value: [tenant-a, tenant-c]
        - name: writer_id
          expression: in
          value: [writer-a]
      abort:
        http_status: 503
        percentage: 100
    access:
    - name: path-0
      match:
        headers:
          - name: X-Auth-Path
            expression: equals
            value: jwt
      authentication:
        jwt:
          providers:
          - issuer-one
      authorization:
        grants:
        - authenticator: issuer-one
          match:
            attributes:
              - name: tenant_id
                expression: in
                value: [tenant-a, tenant-b, tenant-c]
    - name: path-1
      match:
        headers:
          - name: X-Auth-Path
            expression: equals
            value: api_key
      authentication:
        api_key:
          authenticator: partner-key
      authorization:
        grants:
        - authenticator: partner-key
          match:
            attributes:
              - name: tenant_id
                expression: in
                value: [tenant-a, tenant-b, tenant-c]
  - name: healthy
    access:
    - name: path-0
      match:
        headers:
          - name: X-Auth-Path
            expression: equals
            value: jwt
      authentication:
        jwt:
          providers:
          - issuer-one
      authorization:
        grants:
        - authenticator: issuer-one
          match:
            attributes:
              - name: tenant_id
                expression: in
                value: [tenant-a, tenant-b, tenant-c]
    - name: path-1
      match:
        headers:
          - name: X-Auth-Path
            expression: equals
            value: api_key
      authentication:
        api_key:
          authenticator: partner-key
      authorization:
        grants:
        - authenticator: partner-key
          match:
            attributes:
              - name: tenant_id
                expression: in
                value: [tenant-a, tenant-b, tenant-c]
apis:
- name: injected
  metrics:
    labels:
      tenant: {from: {attribute: tenant_id}}
      writer: {from: {attribute: writer_id}}
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    - POST
    path:
      expression: prefix
      value: "/injected/"
    rewrite:
      prefix: "/anything/injected/"
- name: healthy
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - POST
    path:
      expression: prefix
      value: "/healthy/"
    rewrite:
      prefix: "/anything/healthy/"
kubernetes:
  name: auth-gateway
  namespace: gateway-test
