version: 1
authenticators:
  - name: issuer-one
    jwt:
      issuer: https://issuer-one.jwt.test
      jwks:
        uri: https://jwks.jwt.test/issuer-one
      audiences: [gateway-test]
    attributes:
      tenant_id: {claim_path: [organization, id]}
      writer_id: {claim_path: [sub]}
  - name: partner-key
    api_key:
      secret: gateway-api-keys
      header: X-Partner-Key
    attributes:
      tenant_id: {credential: true}
      writer_id: {credential: true}
authorization_policies:
  - name: writers
    grants:
      - authenticator: issuer-one
        apis: [injected, healthy]
        attributes:
          tenant_id: [tenant-a, tenant-b, tenant-c]
      - authenticator: partner-key
        apis: [injected, healthy]
        attributes:
          tenant_id: [tenant-a, tenant-b, tenant-c]
servers:
  - hostname: fault.example.com
    authentication: {any_of: [issuer-one, partner-key]}
    authorization: {any_of: [writers]}
    apis: [injected, healthy]
apis:
  - name: injected
    metrics:
      labels:
        tenant: tenant_id
        writer: writer_id
    fault_injection:
      enabled: true
      match:
        headers:
          X-Inject-Fault: "true"
        attributes:
          tenant_id: [tenant-a, tenant-c]
          writer_id: [writer-a]
      abort:
        http_status: 503
        percentage: 100
    upstream: {address: httpbin, port: 8080}
    routes:
      - methods: [GET, POST]
        path: {prefix: /injected/}
        rewrite: {prefix: /anything/injected/}
  - name: healthy
    upstream: {address: httpbin, port: 8080}
    routes:
      - methods: [POST]
        path: {prefix: /healthy/}
        rewrite: {prefix: /anything/healthy/}
kubernetes:
  name: auth-gateway
  namespace: gateway-test
