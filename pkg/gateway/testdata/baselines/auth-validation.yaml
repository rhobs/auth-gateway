---
version: 1
authenticators:
- name: internal-jwt
  jwt:
    issuer: https://internal.jwt.test
    jwks:
      uri: https://internal.jwt.test/jwks
    audiences:
    - gateway-test
  attributes:
    - name: tenant_id
      from_source: claim
      value: [organization, id]
    - name: writer_id
      from_source: claim
      value: [sub]
    - name: requested_tenant
      from_source: header
      value: X-Tenant
- name: external-jwt
  jwt:
    issuer: https://external.jwt.test
    jwks:
      uri: https://external.jwt.test/jwks
    audiences:
    - gateway-test
  attributes:
    - name: tenant_id
      from_source: claim
      value: [organization, id]
    - name: writer_id
      from_source: claim
      value: [sub]
- name: partner-key
  api_key:
    secret: auth-gateway-api-keys
    header: X-Partner-Key
  attributes:
    - name: tenant_id
      from_source: credential
      value: tenant_id
    - name: writer_id
      from_source: credential
      value: writer_id
    - name: requested_tenant
      from_source: header
      value: X-Tenant
apis:
- name: metrics-write
  metrics:
    labels:
      tenant: tenant_id
      writer: writer_id
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - POST
    path:
      exact: "/metrics/api/v1/receive"
    rewrite:
      path: "/api/v1/receive"
    processing:
      request_headers:
      - name: X-Scope-OrgID
        from_attribute: tenant_id
      - name: X-Writer-ID
        from_attribute: writer_id
- name: metrics-query
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    path:
      exact: "/metrics/api/v1/query"
    rewrite:
      path: "/api/v1/query"
- name: logs
  metrics: {}
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - POST
    path:
      prefix: "/logs/otlp/"
    rewrite:
      prefix: "/otlp/"
servers:
- hostname: internal.auth.test
  apis:
  - name: metrics-write
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - internal-jwt
          - external-jwt
      authorization:
        grants:
        - authenticator: internal-jwt
          attributes:
            tenant_id:
            - client-123
            - client-456
        - authenticator: external-jwt
          attributes:
            tenant_id:
            - customer-456
  - name: metrics-query
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - internal-jwt
          - external-jwt
      authorization:
        grants:
        - authenticator: internal-jwt
          attributes:
            tenant_id:
            - client-123
            - client-456
        - authenticator: external-jwt
          attributes:
            tenant_id:
            - customer-456
  - name: logs
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - internal-jwt
          - external-jwt
      authorization:
        grants:
        - authenticator: internal-jwt
          attributes:
            tenant_id:
            - client-123
        - authenticator: external-jwt
          attributes:
            tenant_id:
            - customer-456
- hostname: external.auth.test
  apis:
  - name: metrics-write
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - internal-jwt
          - external-jwt
      authorization:
        grants:
        - authenticator: internal-jwt
          attributes:
            tenant_id:
            - client-123
            - client-456
        - authenticator: external-jwt
          attributes:
            tenant_id:
            - customer-456
kubernetes:
  name: auth-gateway
  namespace: gateway-test
