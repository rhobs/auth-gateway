---
version: 1
authenticators:
- name: internal-jwt
  jwt:
    issuer: https://sso.example.com/realms/observability
    jwks:
      uri: https://sso.example.com/realms/observability/jwks
  attributes:
    - name: tenant_id
      from_source: claim
      value: [tenant]
servers:
- hostname: write.example.com
  tls_config: {secret: gateway-tls}
  apis:
  - name: metrics
    access:
    - name: default
      authentication:
        jwt: {providers: [internal-jwt]}
      authorization:
        grants:
        - authenticator: internal-jwt
          attributes:
            - name: tenant_id
              expression: equals
              value: client-a
apis:
- name: metrics
  upstream:
    address: metrics-backend.example.com
    port: 9090
  routes:
  - methods:
    - GET
    path:
      exact: "/metrics"
kubernetes:
  name: auth-gateway
  namespace: observability
