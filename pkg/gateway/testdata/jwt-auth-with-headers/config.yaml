---
version: 1
authenticators:
- name: internal-jwt
  jwt:
    issuer: https://issuer-one.jwt.test
    jwks:
      uri: https://issuer-one.jwt.test/jwks
    audiences:
    - gateway-test
  attributes:
    - name: tenant_id
      from:
        claim: [organization, id]
    - name: writer_id
      from:
        claim: [sub]
apis:
- name: metrics
  upstream:
    address: thanos-receive
    port: 19291
  routes:
  - methods:
    - GET
    path:
      expression: equals
      value: "/protected"
    rewrite:
      path: "/anything"
    processing:
      request_headers:
      - name: X-Scope-OrgID
        from: {attribute: tenant_id}
      - name: X-Writer-ID
        from: {attribute: writer_id}
servers:
- hostname: writer.jwt.example.test
  apis:
  - name: metrics
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - internal-jwt
      authorization:
        grants:
        - authenticator: internal-jwt
          match:
            attributes:
              - name: tenant_id
                expression: equals
                value: customer-a
kubernetes:
  name: auth-gateway
  namespace: observability
