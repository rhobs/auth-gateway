version: 1

authenticators:
  - name: internal-jwt
    jwt:
      issuer: https://issuer-one.jwt.test
      jwks:
        uri: https://issuer-one.jwt.test/jwks
      audiences: [gateway-test]
    attributes:
      tenant_id:
        claim_path: [organization, id]
      writer_id:
        claim_path: [sub]

authorization_policies:
  - name: metrics-writers
    grants:
      - authenticator: internal-jwt
        apis: [metrics]
        attributes:
          tenant_id: [customer-a]

apis:
  - name: metrics
    upstream:
      address: thanos-receive
      port: 19291
    routes:
      - methods: [GET]
        path:
          exact: /protected
        rewrite:
          path: /anything
        processing:
          request_headers:
            - name: X-Scope-OrgID
              from_attribute: tenant_id
            - name: X-Writer-ID
              from_attribute: writer_id

servers:
  - hostname: writer.jwt.example.test
    authentication:
      any_of: [internal-jwt]
    authorization:
      any_of: [metrics-writers]
    apis: [metrics]

kubernetes:
  name: auth-gateway
  namespace: observability
