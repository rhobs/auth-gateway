---
version: 1
node:
  id: api-key-e2e
  cluster: auth-gateway
authenticators:
- name: issuer-one
  jwt:
    issuer: https://issuer-one.jwt.test
    jwks:
      uri: https://jwks.jwt.test/issuer-one
    audiences:
    - gateway-test
  attributes:
    - name: tenant_id
      from_source: claim
      value: [organization, id]
    - name: writer_id
      from_source: claim
      value: [sub]
- name: partner-key
  api_key:
    secret: auth-gateway-api-keys
    header: X-Partner-Key
  attributes:
    - name: tenant_id
      from_source: credential
      value: tenant_id
    - name: writer_id
      from_source: credential
      value: writer_id
- name: issuer-two
  jwt:
    issuer: https://issuer-two.jwt.test
    jwks:
      uri: https://jwks.jwt.test/issuer-two
    audiences:
    - gateway-test
  attributes:
    - name: tenant_id
      from_source: claim
      value: [organization, id]
    - name: writer_id
      from_source: claim
      value: [sub]
observability:
  metrics:
    custom_metric_name: gateway_http_requests_total
apis:
- name: ingest
  metrics:
    labels:
      tenant: tenant_id
      writer: writer_id
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - POST
    path:
      exact: "/ingest"
    rewrite:
      path: "/anything"
    processing:
      request_headers:
      - name: X-Scope-OrgID
        from_attribute: tenant_id
      - name: X-Writer-ID
        from_attribute: writer_id
- name: public
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    path:
      exact: "/health"
    rewrite:
      path: "/anything"
servers:
- hostname: public.api-key.auth-gateway.test
  apis:
  - name: public
    public: true
- hostname: key.api-key.auth-gateway.test
  apis:
  - name: ingest
    access:
    - name: default
      authentication:
        api_key:
          authenticator: partner-key
      authorization:
        grants:
        - authenticator: partner-key
          attributes:
            tenant_id:
            - client-a
            - client-b
            writer_id:
            - writer-a
            - writer-b
- hostname: shared.api-key.auth-gateway.test
  apis:
  - name: ingest
    access:
    - match:
        headers:
          X-Tenant:
            exact: client-b
      authentication:
        jwt:
          providers:
          - issuer-one
      authorization:
        grants:
        - authenticator: issuer-one
          attributes:
            tenant_id:
            - client-b
            writer_id:
            - writer-a
            - writer-b
      tenant: client-b
    - match:
        headers:
          X-Tenant:
            exact: client-a
      authentication:
        api_key:
          authenticator: partner-key
      authorization:
        grants:
        - authenticator: partner-key
          attributes:
            tenant_id:
            - client-a
            writer_id:
            - writer-a
            - writer-b
      tenant: client-a
- hostname: key-tls.api-key.auth-gateway.test
  apis:
  - name: ingest
    access:
    - name: default
      authentication:
        api_key:
          authenticator: partner-key
      authorization:
        grants:
        - authenticator: partner-key
          attributes:
            tenant_id:
            - client-a
            - client-b
            writer_id:
            - writer-a
            - writer-b
  tls_config:
    secret: api-key-gateway-tls
kubernetes:
  name: auth-gateway
  namespace: default
  replicas: 1
  service_port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: '1'
      memory: 256Mi
