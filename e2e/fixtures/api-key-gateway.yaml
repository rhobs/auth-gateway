version: 1
node:
  id: api-key-e2e
  cluster: auth-gateway
authenticators:
  - name: issuer-one
    jwt:
      issuer: https://issuer-one.jwt.test
      jwks:
        uri: https://jwks.jwt.test/issuer-one
      audiences: [gateway-test]
    attributes:
      tenant_id:
        claim_path: [organization, id]
      writer_id:
        claim_path: [sub]
  - name: partner-key
    api_key:
      secret: auth-gateway-api-keys
      header: X-Partner-Key
    attributes:
      tenant_id: {credential: true}
      writer_id: {credential: true}
authorization_policies:
  - name: jwt-writers
    grants:
      - authenticator: issuer-one
        apis: [ingest]
        attributes:
          tenant_id: [client-a, client-b]
          writer_id: [writer-a, writer-b]
  - name: key-writers
    grants:
      - authenticator: partner-key
        apis: [ingest]
        attributes:
          tenant_id: [client-a, client-b]
          writer_id: [writer-a, writer-b]
observability:
  metrics:
    custom_metric_name: gateway_http_requests_total

apis:
  - name: ingest
    metrics:
      labels:
        tenant: tenant_id
        writer: writer_id
    upstream:
      address: httpbin
      port: 8080
    routes:
      - methods: [POST]
        path:
          exact: /ingest
        rewrite:
          path: /anything
        processing:
          request_headers:
            - name: X-Scope-OrgID
              from_attribute: tenant_id
            - name: X-Writer-ID
              from_attribute: writer_id
  - name: public
    upstream:
      address: httpbin
      port: 8080
    routes:
      - methods: [GET]
        path:
          exact: /health
        rewrite:
          path: /anything
processing:
  - name: tenants
    type: attribute-mapper
    attributes:
      tenant_id:
        mappings:
          client-a: team-a
          client-b: team-b
servers:
  - hostname: public.api-key.auth-gateway.test
    apis: [public]
  - hostname: key.api-key.auth-gateway.test
    authentication:
      any_of: [partner-key]
    authorization:
      any_of: [key-writers]
    apis: [ingest]
  - hostname: any.api-key.auth-gateway.test
    authentication:
      any_of: [issuer-one, partner-key]
    authorization:
      any_of: [jwt-writers, key-writers]
    apis: [ingest]
  - hostname: all.api-key.auth-gateway.test
    tls_config:
      secret: api-key-gateway-tls
    authentication:
      all_of: [issuer-one, partner-key]
    authorization:
      all_of: [jwt-writers, key-writers]
    apis: [ingest]
kubernetes:
  name: auth-gateway
  namespace: default
  image: envoyproxy/envoy:v1.39.1
  otel_collector_image: otel/opentelemetry-collector-contrib:0.135.0
  replicas: 1
  service_port: 80
  https_service_port: 443
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
