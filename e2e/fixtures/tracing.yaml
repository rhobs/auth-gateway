---
version: 1
node:
  id: tracing-e2e
  cluster: tracing-e2e
observability:
  metrics:
    enabled: true
    custom_metric_name: gateway_http_requests_total
  tracing:
    enabled: true
    endpoint: trace-sink.auth-gateway-tracing-e2e.svc.cluster.local:4317
    service_name: auth-gateway-tracing-e2e
    sampling_percentage: 100
    insecure: true
authenticators:
- name: tracing-key
  api_key:
    secret: auth-gateway-tracing-keys
    header: X-Trace-Key
  attributes:
    - name: tenant_id
      from_source: credential
      value: tenant_id
apis:
- name: tracing
  metrics: {}
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    path:
      exact: "/trace"
    rewrite:
      path: "/anything/trace"
servers:
- hostname: tracing.auth-gateway.test
  apis:
  - name: tracing
    access:
    - name: default
      authentication:
        api_key:
          authenticator: tracing-key
      authorization:
        grants:
        - authenticator: tracing-key
          attributes:
            - name: tenant_id
              expression: equals
              value: trace-client
kubernetes:
  name: auth-gateway
  namespace: auth-gateway-tracing-e2e
  replicas: 1
  service_port: 80
