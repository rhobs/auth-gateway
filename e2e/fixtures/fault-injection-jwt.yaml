---
version: 1
authenticators:
- name: issuer-one
  jwt:
    issuer: https://issuer-one.jwt.test
    jwks:
      uri: https://jwks.jwt.test/issuer-one
    audiences:
    - gateway-test
  attributes:
    - name: tenant_id
      from_source: claim
      value: [organization, id]
servers:
- hostname: fault.jwt.auth-gateway.test
  apis:
  - name: injected
    fault_injection:
      enabled: true
      match:
        attributes:
        - name: tenant_id
          expression: in
          value: [customer-a, customer-denied]
      abort:
        http_status: 503
        percentage: 100
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - issuer-one
      authorization:
        grants:
        - authenticator: issuer-one
          attributes:
            - name: tenant_id
              expression: in
              value: [customer-a, customer-b]
  - name: healthy
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - issuer-one
      authorization:
        grants:
        - authenticator: issuer-one
          attributes:
            - name: tenant_id
              expression: in
              value: [customer-a, customer-b]
observability:
  metrics:
    custom_metric_name: gateway_http_requests_total
apis:
- name: injected
  metrics:
    labels:
      tenant: tenant_id
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    path:
      prefix: "/injected/"
    rewrite:
      prefix: "/anything/injected/"
    processing:
      request_headers:
      - name: X-Scope-OrgID
        from_attribute: tenant_id
- name: healthy
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    path:
      exact: "/protected"
    rewrite:
      path: "/anything"
kubernetes:
  name: auth-gateway
  namespace: default
  replicas: 1
