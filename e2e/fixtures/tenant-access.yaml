version: 1
authenticators:
  - name: issuer-one
    jwt:
      issuer: https://issuer-one.jwt.test
      jwks: {uri: https://jwks.jwt.test/issuer-one}
      audiences: [gateway-test]
    attributes:
      - name: tenant_id
        from_source: claim
        value: [organization, id]
      - name: role
        from_source: claim
        value: [role]
      - name: writer_id
        from_source: claim
        value: [sub]
      - name: requested_tenant
        from_source: header
        value: X-Tenant
  - name: partner-key
    api_key: {secret: auth-gateway-api-keys, header: X-Partner-Key}
    attributes:
      - name: tenant_id
        from_source: credential
        value: tenant_id
      - name: role
        from_source: credential
        value: role
      - name: writer_id
        from_source: credential
        value: writer_id
      - name: requested_tenant
        from_source: header
        value: X-Tenant
  - name: issuer-two
    jwt:
      issuer: https://issuer-two.jwt.test
      jwks: {uri: https://jwks.jwt.test/issuer-two}
      audiences: [gateway-test]
    attributes:
      - name: tenant_id
        from_source: claim
        value: [account, tenant]
      - name: role
        from_source: claim
        value: [permissions, role]
      - name: writer_id
        from_source: claim
        value: [sub]
      - name: requested_tenant
        from_source: header
        value: X-Tenant
apis:
  - name: journey-write
    upstream: {address: httpbin, port: 8080}
    metrics: {}
    routes:
      - methods: [POST]
        path: {exact: /write}
        rewrite: {path: /anything}
        processing:
          request_headers:
            - {name: X-Scope-OrgID, from_attribute: requested_tenant}
            - {name: X-Verified-Tenant, from_attribute: tenant_id}
  - name: journey-read
    upstream: {address: httpbin, port: 8080}
    routes:
      - methods: [GET]
        path: {exact: /read}
        rewrite: {path: /anything}
        processing:
          request_headers:
            - {name: X-Scope-OrgID, from_attribute: requested_tenant}
  - name: journey-health
    upstream: {address: httpbin, port: 8080}
    routes:
      - methods: [GET]
        path: {exact: /health}
        rewrite: {path: /anything}
servers:
  - hostname: access.auth-gateway.test
    apis:
      - name: journey-write
        access:
          - tenant: external-a
            match:
              headers:
                X-Tenant: {exact: external-a}
                X-Environment: {exact: production}
            authentication:
              jwt: {providers: [issuer-two]}
            authorization:
              grants:
                - authenticator: issuer-two
                  attributes:
                    tenant_id: [external-org]
                    role: [writer]
          - name: internal-writers
            match:
              headers:
                X-Tenant: {in: [client-a, client-b]}
                X-Environment: {exact: production}
            authentication:
              jwt: {providers: [issuer-one]}
            authorization:
              grants:
                - authenticator: issuer-one
                  attributes:
                    tenant_id: {equals_attribute: requested_tenant}
                    role: [writer]
          - tenant: key-a
            match:
              headers:
                X-Tenant: {exact: key-a}
                X-Environment: {exact: production}
            authentication:
              api_key: {authenticator: partner-key}
            authorization:
              grants:
                - authenticator: partner-key
                  attributes:
                    tenant_id: {equals_attribute: requested_tenant}
                    role: [writer]
      - name: journey-read
        access:
          - name: readers
            match:
              headers:
                X-Tenant: {in: [client-a, client-b]}
                X-Environment: {exact: production}
            authentication:
              jwt: {providers: [issuer-one, issuer-two]}
            authorization:
              grants:
                - authenticator: issuer-one
                  attributes:
                    tenant_id: {equals_attribute: requested_tenant}
                    role: [reader]
                - authenticator: issuer-two
                  attributes:
                    tenant_id: {equals_attribute: requested_tenant}
                    role: [viewer]
      - name: journey-health
        public: true
kubernetes:
  name: auth-gateway
  namespace: default
