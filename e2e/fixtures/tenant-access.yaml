version: 1
authenticators:
  - name: issuer-one
    jwt:
      issuer: https://issuer-one.jwt.test
      jwks: {uri: https://jwks.jwt.test/issuer-one}
      audiences: [gateway-test]
    attributes:
      - name: tenant_id
        from_source: claim
        value: [organization, id]
      - name: role
        from_source: claim
        value: [role]
      - name: writer_id
        from_source: claim
        value: [sub]
      - name: fault_writer
        from_source: header
        value: X-Writer
      - name: requested_tenant
        from_source: header
        value: X-Tenant
  - name: partner-key
    api_key: {secret: auth-gateway-api-keys, header: X-Partner-Key}
    attributes:
      - name: tenant_id
        from_source: credential
        value: tenant_id
      - name: role
        from_source: credential
        value: role
      - name: writer_id
        from_source: credential
        value: writer_id
      - name: fault_writer
        from_source: credential
        value: writer_id
      - name: requested_tenant
        from_source: header
        value: X-Tenant
  - name: issuer-two
    jwt:
      issuer: https://issuer-two.jwt.test
      jwks: {uri: https://jwks.jwt.test/issuer-two}
      audiences: [gateway-test]
    attributes:
      - name: tenant_id
        from_source: claim
        value: [account, tenant]
      - name: role
        from_source: claim
        value: [permissions, role]
      - name: writer_id
        from_source: claim
        value: [sub]
      - name: requested_tenant
        from_source: header
        value: X-Tenant
apis:
  - name: journey-write
    upstream: {address: httpbin, port: 8080}
    metrics: {}
    routes:
      - methods: [POST]
        path: {exact: /write}
        rewrite: {path: /anything}
        processing:
          request_headers:
            - {name: X-Scope-OrgID, from_attribute: requested_tenant}
            - {name: X-Verified-Tenant, from_attribute: tenant_id}
  - name: journey-read
    upstream: {address: httpbin, port: 8080}
    routes:
      - methods: [GET]
        path: {exact: /read}
        rewrite: {path: /anything}
        processing:
          request_headers:
            - {name: X-Scope-OrgID, from_attribute: requested_tenant}
  - name: journey-health
    upstream: {address: httpbin, port: 8080}
    routes:
      - methods: [GET]
        path: {exact: /health}
        rewrite: {path: /anything}
servers:
  - hostname: access.auth-gateway.test
    apis:
      - name: journey-write
        fault_injection:
          enabled: true
          match:
            headers:
              - name: X-Inject-Fault
                expression: equals
                value: "true"
            attributes:
              - name: fault_writer
                expression: equals
                value: key-writer
          abort:
            http_status: 503
            percentage: 100
        access:
          - tenant: external-a
            match:
              headers:
                - name: X-Tenant
                  expression: equals
                  value: external-a
                - name: X-Environment
                  expression: equals
                  value: production
            authentication:
              jwt: {providers: [issuer-two]}
            authorization:
              grants:
                - authenticator: issuer-two
                  attributes:
                    - name: tenant_id
                      expression: equals
                      value: external-org
                    - name: role
                      expression: equals
                      value: writer
          - name: internal-writers
            match:
              headers:
                - name: X-Tenant
                  expression: in
                  value: [client-a, client-b]
                - name: X-Environment
                  expression: equals
                  value: production
            authentication:
              jwt: {providers: [issuer-one]}
            authorization:
              grants:
                - authenticator: issuer-one
                  attributes:
                    - name: tenant_id
                      expression: equals-attribute
                      value: requested_tenant
                    - name: role
                      expression: equals
                      value: writer
          - tenant: key-a
            match:
              headers:
                - name: X-Tenant
                  expression: equals
                  value: key-a
                - name: X-Environment
                  expression: equals
                  value: production
            authentication:
              api_key: {authenticator: partner-key}
            authorization:
              grants:
                - authenticator: partner-key
                  attributes:
                    - name: tenant_id
                      expression: equals-attribute
                      value: requested_tenant
                    - name: role
                      expression: equals
                      value: writer
      - name: journey-read
        access:
          - name: readers
            match:
              headers:
                - name: X-Tenant
                  expression: in
                  value: [client-a, client-b]
                - name: X-Environment
                  expression: equals
                  value: production
            authentication:
              jwt: {providers: [issuer-one, issuer-two]}
            authorization:
              grants:
                - authenticator: issuer-one
                  attributes:
                    - name: tenant_id
                      expression: equals-attribute
                      value: requested_tenant
                    - name: role
                      expression: equals
                      value: reader
                - authenticator: issuer-two
                  attributes:
                    - name: tenant_id
                      expression: equals-attribute
                      value: requested_tenant
                    - name: role
                      expression: equals
                      value: viewer
      - name: journey-health
        public: true
kubernetes:
  name: auth-gateway
  namespace: default
