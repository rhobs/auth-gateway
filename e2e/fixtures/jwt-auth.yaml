version: 1
node:
  id: jwt-auth-e2e
  cluster: jwt-auth-e2e
listener:
  port: 8080
authenticators:
  - name: issuer-one
    jwt:
      issuer: https://issuer-one.jwt.test
      jwks_uri: https://jwks.jwt.test/issuer-one
      audiences: [gateway-test]
      attributes:
        tenant_id:
          claim_path: [organization, id]
authorization_policies:
  - name: metrics-writers
    grants:
      - authenticator: issuer-one
        apis: [metrics]
        attributes:
          tenant_id: [customer-a]
apis:
  - name: metrics
    upstream:
      address: httpbin
      port: 8080
    routes:
      - methods: [GET]
        path:
          exact: /protected
        rewrite:
          path: /anything
servers:
  - hostname: plain.jwt.auth-gateway.test
    authentication:
      any_of: [issuer-one]
    authorization:
      any_of: [metrics-writers]
    apis: [metrics]
kubernetes:
  name: auth-gateway
  namespace: default
  image: envoyproxy/envoy:v1.39.1
  otel_collector_image: otel/opentelemetry-collector-contrib:0.135.0
  replicas: 1
  service_port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
