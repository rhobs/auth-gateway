---
version: 1
node:
  id: jwt-auth-e2e
  cluster: jwt-auth-e2e
listener:
  port: 8080
authenticators:
- name: issuer-one
  jwt:
    issuer: https://issuer-one.jwt.test
    jwks:
      uri: https://jwks.jwt.test/issuer-one
  attributes:
    - name: my_list
      from_source: claim
      value: [x, my_list]
apis:
- name: metrics
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    path:
      exact: "/protected"
    rewrite:
      path: "/anything"
servers:
- hostname: plain.jwt.auth-gateway.test
  apis:
  - name: metrics
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - issuer-one
      authorization:
        grants:
        - authenticator: issuer-one
          attributes:
            my_list:
            - y
            - z
kubernetes:
  name: auth-gateway
  namespace: default
  replicas: 1
  service_port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: '1'
      memory: 256Mi
