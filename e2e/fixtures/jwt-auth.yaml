---
version: 1
node:
  id: jwt-auth-e2e
  cluster: jwt-auth-e2e
listener:
  port: 8080
authenticators:
- name: issuer-one
  jwt:
    issuer: https://issuer-one.jwt.test
    jwks:
      uri: https://jwks.jwt.test/issuer-one
  attributes:
    - name: my_list
      from:
        claim: [x, my_list]
    - name: groups
      from:
        claim: [token, groups]
    - name: feature
      from:
        claim: [feature]
apis:
- name: metrics
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    path:
      expression: equals
      value: "/protected"
    rewrite:
      path: "/anything"
- name: groups-exact
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods: [GET]
    path: {expression: equals, value: /groups-exact}
    rewrite: {path: /anything}
- name: groups-any
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods: [GET]
    path: {expression: equals, value: /groups-any}
    rewrite: {path: /anything}
- name: presence
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods: [GET]
    path: {expression: equals, value: /presence}
    rewrite: {path: /anything}
servers:
- hostname: plain.jwt.auth-gateway.test
  apis:
  - name: metrics
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - issuer-one
      authorization:
        grants:
        - authenticator: issuer-one
          match:
            attributes:
              - name: my_list
                expression: in
                value: [y, z]
  - name: groups-exact
    access:
    - name: default
      authentication:
        jwt: {providers: [issuer-one]}
      authorization:
        grants:
        - authenticator: issuer-one
          match:
            attributes:
            - name: groups
              expression: has
              value: metrics-admins
  - name: groups-any
    access:
    - name: default
      authentication:
        jwt: {providers: [issuer-one]}
      authorization:
        grants:
        - authenticator: issuer-one
          match:
            attributes:
            - name: groups
              expression: has-one-of
              value: [metrics-readers, metrics-writers]
  - name: presence
    access:
    - name: default
      authentication:
        jwt: {providers: [issuer-one]}
      authorization:
        grants:
        - authenticator: issuer-one
          match:
            attributes:
            - name: feature
              expression: nonempty
kubernetes:
  name: auth-gateway
  namespace: default
  replicas: 1
  service_port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: '1'
      memory: 256Mi
