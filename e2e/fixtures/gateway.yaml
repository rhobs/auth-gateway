version: 1

listener:
  port: 8080
  http_hosts: [auth.auth-gateway.test]
  https_hosts: [tls.auth-gateway.test]

server_tls:
  secret: auth-gateway-tls

apis:
  - name: metrics
    upstream:
      address: httpbin
      port: 8080
    routes:
      - methods: [POST]
        path:
          exact: /metrics/api/v1/receive
        rewrite:
          path: /anything/api/v1/receive

  - name: upstream-health
    upstream:
      address: httpbin
      port: 8080
    routes:
      - methods: [GET]
        path:
          exact: /upstream-health
        rewrite:
          path: /status/200

kubernetes:
  name: auth-gateway
  namespace: auth-gateway-e2e
  image: envoyproxy/envoy:v1.39.1
  replicas: 1
