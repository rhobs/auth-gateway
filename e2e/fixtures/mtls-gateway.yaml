---
version: 1
authenticators:
- name: client-cert
  mtls:
    trusted_ca:
      config_map:
        name: gateway-client-ca
        key: ca.crt
  attributes:
    - name: tenant_id
      from_source: certificate
      value: uri_san
    - name: dns_id
      from_source: certificate
      value: dns_san
    - name: requested_tenant
      from_source: header
      value: X-Tenant
apis:
- name: ingest
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - POST
    path:
      exact: "/ingest"
    rewrite:
      path: "/anything"
    processing:
      request_headers:
      - name: X-Scope-OrgID
        from_attribute: tenant_id
- name: probe
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - POST
    path:
      exact: "/trust"
    rewrite:
      path: "/anything"
servers:
- hostname: cert.mtls.auth-gateway.test
  tls_config:
    secret: mtls-gateway-tls
    mtls:
      authenticator: client-cert
  apis:
  - name: ingest
    access:
    - name: default
      match:
        headers:
          - name: X-Tenant
            expression: equals
            value: client-a
      authorization:
        grants:
        - authenticator: client-cert
          attributes:
            - name: tenant_id
              expression: equals
              value: spiffe://clients.example.test/client-a
            - name: dns_id
              expression: equals
              value: client-a.example.test
- hostname: trust.mtls.auth-gateway.test
  tls_config:
    secret: mtls-gateway-tls
    mtls:
      authenticator: client-cert
  apis:
  - name: probe
    access:
    - name: default
      authorization:
        grants:
        - authenticator: client-cert
          attributes: []
kubernetes:
  name: auth-gateway
  namespace: default
  replicas: 1
  service_port: 80
  https_service_port: 443
