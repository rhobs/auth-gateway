version: 1
authenticators:
  - name: issuer-one
    jwt:
      issuer: https://issuer-one.jwt.test
      jwks:
        uri: https://jwks.jwt.test/issuer-one
      audiences: [gateway-test]
    attributes:
      tenant_id: {claim_path: [organization, id]}
  - name: client-cert
    mtls:
      trusted_ca:
        config_map: {name: gateway-client-ca, key: ca.crt}
    attributes:
      tenant_id: {uri_san: true}
      dns_id: {dns_san: true}
      requested_tenant: {header: X-Tenant}
  - name: partner-key
    api_key:
      secret: gateway-api-keys
      header: X-Partner-Key
    attributes:
      tenant_id: {credential: true}
authorization_policies:
  - name: jwt-writers
    grants:
      - authenticator: issuer-one
        apis: [ingest]
        attributes:
          tenant_id: [spiffe://clients.example.test/client-a, spiffe://clients.example.test/client-b]
  - name: mtls-writers
    grants:
      - authenticator: client-cert
        apis: [ingest]
        attributes:
          tenant_id: [spiffe://clients.example.test/client-a]
          dns_id: [client-a.example.test]
          requested_tenant: [client-a]
  - name: key-writers
    grants:
      - authenticator: partner-key
        apis: [ingest]
        attributes:
          tenant_id: [spiffe://clients.example.test/client-a]
  - name: trusted-clients
    grants:
      - authenticator: client-cert
        apis: [probe]
        attributes: {}
apis:
  - name: ingest
    upstream: {address: httpbin, port: 8080}
    routes:
      - methods: [POST]
        path: {exact: /ingest}
        rewrite: {path: /anything}
        processing:
          request_headers:
            - {name: X-Scope-OrgID, from_attribute: tenant_id}
  - name: probe
    upstream: {address: httpbin, port: 8080}
    routes:
      - methods: [GET]
        path: {exact: /trust}
        rewrite: {path: /anything}
processing:
  - name: tenants
    type: attribute-mapper
    attributes:
      tenant_id:
        mappings:
          spiffe://clients.example.test/client-a: team-a
          spiffe://clients.example.test/client-b: team-b
servers:
  - hostname: cert.mtls.auth-gateway.test
    tls_config: {secret: mtls-gateway-tls}
    authentication: {any_of: [client-cert]}
    authorization: {any_of: [mtls-writers]}
    apis: [ingest]
  - hostname: mixed.mtls.auth-gateway.test
    tls_config: {secret: mtls-gateway-tls}
    authentication: {any_of: [issuer-one, client-cert, partner-key]}
    authorization: {any_of: [jwt-writers, mtls-writers, key-writers]}
    apis: [ingest]
  - hostname: jwt-cert.mtls.auth-gateway.test
    tls_config: {secret: mtls-gateway-tls}
    authentication: {any_of: [issuer-one, client-cert]}
    authorization: {any_of: [jwt-writers, mtls-writers]}
    apis: [ingest]
  - hostname: all.mtls.auth-gateway.test
    tls_config: {secret: mtls-gateway-tls}
    authentication: {all_of: [issuer-one, client-cert, partner-key]}
    authorization: {all_of: [jwt-writers, mtls-writers, key-writers]}
    apis: [ingest]
  - hostname: trust.mtls.auth-gateway.test
    tls_config: {secret: mtls-gateway-tls}
    authentication: {any_of: [client-cert]}
    authorization: {any_of: [trusted-clients]}
    apis: [probe]
kubernetes:
  name: auth-gateway
  namespace: default
  replicas: 1
  service_port: 80
  https_service_port: 443
