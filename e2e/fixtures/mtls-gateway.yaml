---
version: 1
authenticators:
- name: client-cert
  mtls:
    trusted_ca:
      config_map:
        name: gateway-client-ca
        key: ca.crt
  attributes:
    tenant_id:
      uri_san: true
    dns_id:
      dns_san: true
    requested_tenant:
      header: X-Tenant
apis:
- name: ingest
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - POST
    path:
      exact: "/ingest"
    rewrite:
      path: "/anything"
    processing:
      request_headers:
      - name: X-Scope-OrgID
        from_attribute: tenant_id
- name: probe
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - POST
    path:
      exact: "/trust"
    rewrite:
      path: "/anything"
servers:
- hostname: cert.mtls.auth-gateway.test
  tls_config:
    secret: mtls-gateway-tls
    mtls:
      authenticator: client-cert
  apis:
  - name: ingest
    access:
    - name: default
      match:
        headers:
          X-Tenant:
            exact: client-a
      authorization:
        grants:
        - authenticator: client-cert
          attributes:
            tenant_id:
            - spiffe://clients.example.test/client-a
            dns_id:
            - client-a.example.test
- hostname: trust.mtls.auth-gateway.test
  tls_config:
    secret: mtls-gateway-tls
    mtls:
      authenticator: client-cert
  apis:
  - name: probe
    access:
    - name: default
      authorization:
        grants:
        - authenticator: client-cert
          attributes: {}
kubernetes:
  name: auth-gateway
  namespace: default
  replicas: 1
  service_port: 80
  https_service_port: 443
