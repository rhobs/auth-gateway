---
version: 1
authenticators:
- name: partner-key
  api_key:
    secret: gateway-api-keys
    header: X-Partner-Key
  attributes:
    - name: tenant_id
      from:
        credential: tenant_id
    - name: writer_id
      from:
        credential: writer_id
servers:
- hostname: fault.auth-gateway.test
  apis:
  - name: injected
    fault_injection:
      enabled: true
      match:
        headers:
        - name: X-Inject-Fault
          expression: equals
          value: 'true'
        attributes:
        - name: tenant_id
          expression: in
          value: [tenant-a, tenant-c, tenant-denied]
        - name: writer_id
          expression: in
          value: [writer-a, writer-b]
      abort:
        http_status: 503
        percentage: 100
    access:
    - name: default
      authentication:
        api_key:
          authenticator: partner-key
      authorization:
        grants:
        - authenticator: partner-key
          match:
            attributes:
              - name: tenant_id
                expression: in
                value: [tenant-a, tenant-b, tenant-c]
  - name: healthy
    access:
    - name: default
      authentication:
        api_key:
          authenticator: partner-key
      authorization:
        grants:
        - authenticator: partner-key
          match:
            attributes:
              - name: tenant_id
                expression: in
                value: [tenant-a, tenant-b, tenant-c]
- hostname: fault-plain.auth-gateway.test
  apis:
  - name: injected
    access:
    - name: default
      authentication:
        api_key:
          authenticator: partner-key
      authorization:
        grants:
        - authenticator: partner-key
          match:
            attributes:
            - name: tenant_id
              expression: in
              value: [tenant-a, tenant-b, tenant-c]
observability:
  metrics:
    custom_metric_name: gateway_http_requests_total
    scrape_interval: 1s
    scrape_timeout: 500ms
apis:
- name: injected
  metrics:
    labels:
      tenant: {from: {attribute: tenant_id}}
      writer: {from: {attribute: writer_id}}
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    path:
      expression: equals
      value: "/injected/backend-error"
    rewrite:
      path: "/status/503"
  - methods:
    - GET
    - POST
    path:
      expression: prefix
      value: "/injected/"
    rewrite:
      prefix: "/anything/injected/"
    processing:
      request_headers:
      - name: X-Scope-OrgID
        from: {attribute: tenant_id}
- name: healthy
  metrics: {}
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - POST
    path:
      expression: prefix
      value: "/healthy/"
    rewrite:
      prefix: "/anything/healthy/"
    processing:
      request_headers:
      - name: X-Scope-OrgID
        from: {attribute: tenant_id}
kubernetes:
  name: auth-gateway
  namespace: default
  replicas: 1
