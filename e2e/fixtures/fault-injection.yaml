version: 1

authenticators:
  - name: partner-key
    api_key:
      secret: gateway-api-keys
      header: X-Partner-Key
    attributes:
      tenant_id: {credential: true}
      writer_id: {credential: true}

authorization_policies:
  - name: writers
    grants:
      - authenticator: partner-key
        apis: [injected, healthy]
        attributes:
          tenant_id: [tenant-a, tenant-b, tenant-c]

servers:
  - hostname: fault.auth-gateway.test
    authentication: {any_of: [partner-key]}
    authorization: {any_of: [writers]}
    apis: [injected, healthy]

observability:
  metrics:
    custom_metric_name: gateway_http_requests_total
    scrape_interval: 1s
    scrape_timeout: 500ms

apis:
  - name: injected
    metrics:
      labels:
        tenant: tenant_id
        writer: writer_id
    fault_injection:
      enabled: true
      match:
        headers:
          X-Inject-Fault: "true"
        attributes:
          tenant_id: [tenant-a, tenant-c, tenant-denied]
          writer_id: [writer-a]
      abort:
        http_status: 503
        percentage: 100
    upstream:
      address: httpbin
      port: 8080
    routes:
      - methods: [GET]
        path: {exact: /injected/backend-error}
        rewrite: {path: /status/503}
      - methods: [GET, POST]
        path:
          prefix: /injected/
        rewrite:
          prefix: /anything/injected/
        processing:
          request_headers:
            - name: X-Scope-OrgID
              from_attribute: tenant_id

  - name: healthy
    metrics: {}
    upstream:
      address: httpbin
      port: 8080
    routes:
      - methods: [POST]
        path:
          prefix: /healthy/
        rewrite:
          prefix: /anything/healthy/
        processing:
          request_headers:
            - name: X-Scope-OrgID
              from_attribute: tenant_id

kubernetes:
  name: auth-gateway
  namespace: default
  replicas: 1
