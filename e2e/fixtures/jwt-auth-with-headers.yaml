---
version: 1
node:
  id: jwt-auth-headers-e2e
  cluster: jwt-auth-headers-e2e
listener:
  port: 8080
authenticators:
- name: issuer-one
  jwt:
    issuer: https://issuer-one.jwt.test
    jwks:
      uri: https://jwks.jwt.test/issuer-one
    audiences:
    - gateway-test
  attributes:
    - name: tenant_id
      from:
        claim: [organization, id]
    - name: writer_id
      from:
        claim: [sub]
    - name: requested_tenant
      from:
        header: X-Scope-OrgID
apis:
- name: metrics
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    path:
      expression: equals
      value: "/protected"
    rewrite:
      path: "/anything"
    processing:
      request_headers:
      - name: X-Scope-OrgID
        from: {attribute: tenant_id}
      - name: X-Writer-ID
        from: {attribute: writer_id}
  - methods:
    - GET
    path:
      expression: equals
      value: "/headerless"
    rewrite:
      path: "/anything"
servers:
- hostname: headers.jwt.auth-gateway.test
  apis:
  - name: metrics
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - issuer-one
      authorization:
        grants:
        - authenticator: issuer-one
          match:
            attributes:
              - name: tenant_id
                expression: equals
                value: customer-a
- hostname: managed.jwt.auth-gateway.test
  apis:
  - name: metrics
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - issuer-one
      authorization:
        grants:
        - authenticator: issuer-one
          match:
            attributes:
              - name: tenant_id
                expression: equals
                value: customer-a
      match:
        headers:
          - name: X-Scope-OrgID
            expression: equals
            value: requested-a
kubernetes:
  name: auth-gateway
  namespace: default
  replicas: 1
  service_port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: '1'
      memory: 256Mi
