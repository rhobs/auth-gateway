version: 1
node:
  id: jwt-auth-headers-e2e
  cluster: jwt-auth-headers-e2e
listener:
  port: 8080
authenticators:
  - name: issuer-one
    jwt:
      issuer: https://issuer-one.jwt.test
      jwks:
        uri: https://jwks.jwt.test/issuer-one
      audiences: [gateway-test]
    attributes:
      tenant_id:
        claim_path: [organization, id]
      writer_id:
        claim_path: [sub]
      requested_tenant:
        header: X-Scope-OrgID
authorization_policies:
  - name: metrics-writers
    grants:
      - authenticator: issuer-one
        apis: [metrics]
        attributes:
          tenant_id: [customer-a]
  - name: managed-header-writers
    grants:
      - authenticator: issuer-one
        apis: [metrics]
        attributes:
          requested_tenant: [requested-a]
apis:
  - name: metrics
    upstream:
      address: httpbin
      port: 8080
    routes:
      - methods: [GET]
        path:
          exact: /protected
        rewrite:
          path: /anything
        processing:
          request_headers:
            - name: X-Scope-OrgID
              from_attribute: tenant_id
            - name: X-Writer-ID
              from_attribute: writer_id
      - methods: [GET]
        path:
          exact: /headerless
        rewrite:
          path: /anything
servers:
  - hostname: headers.jwt.auth-gateway.test
    authentication:
      any_of: [issuer-one]
    authorization:
      any_of: [metrics-writers]
    apis: [metrics]
  - hostname: managed.jwt.auth-gateway.test
    authentication:
      any_of: [issuer-one]
    authorization:
      any_of: [managed-header-writers]
    apis: [metrics]
kubernetes:
  name: auth-gateway
  namespace: default
  replicas: 1
  service_port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
