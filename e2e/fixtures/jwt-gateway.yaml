---
version: 1
node:
  id: jwt-e2e
  cluster: jwt-e2e
listener:
  port: 8080
authenticators:
- name: issuer-one
  jwt:
    issuer: https://issuer-one.jwt.test
    jwks:
      uri: https://jwks.jwt.test/issuer-one
    audiences:
    - gateway-test
  attributes:
    - name: tenant_id
      from_source: claim
      value: [organization, id]
    - name: writer_id
      from_source: claim
      value: [sub]
    - name: escaped_id
      from_source: claim
      value: [literal.claim]
- name: issuer-two
  jwt:
    issuer: https://issuer-two.jwt.test
    jwks:
      uri: https://jwks.jwt.test/issuer-two
    audiences:
    - gateway-test
  attributes:
    - name: tenant_id
      from_source: claim
      value: [organization, id]
    - name: writer_id
      from_source: claim
      value: [sub]
    - name: escaped_id
      from_source: claim
      value: [literal.claim]
observability:
  metrics:
    custom_metric_name: gateway_http_requests_total
    scrape_interval: 1s
    scrape_timeout: 500ms
apis:
- name: metrics
  metrics:
    labels:
      tenant: tenant_id
      writer: writer_id
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    path:
      exact: "/protected"
    rewrite:
      path: "/anything"
    processing:
      request_headers:
      - name: X-Scope-OrgID
        from_attribute: tenant_id
      - name: X-Writer-ID
        from_attribute: writer_id
      - name: X-Literal
        from_attribute: escaped_id
  - methods:
    - GET
    path:
      exact: "/headerless"
    rewrite:
      path: "/anything"
  - methods:
    - GET
    path:
      exact: "/required-writer"
    rewrite:
      path: "/anything"
    processing:
      request_headers:
      - name: X-Writer-ID
        from_attribute: writer_id
  - methods:
    - GET
    path:
      exact: "/upstream-status"
    rewrite:
      path: "/status/418"
- name: status-only
  metrics: {}
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    path:
      exact: "/status-only"
    rewrite:
      path: "/anything"
    processing:
      request_headers:
      - name: X-Scope-OrgID
        from_attribute: tenant_id
      - name: X-Writer-ID
        from_attribute: writer_id
      - name: X-Literal
        from_attribute: escaped_id
- name: unmetered
  upstream:
    address: httpbin
    port: 8080
  routes:
  - methods:
    - GET
    path:
      exact: "/unmetered"
    rewrite:
      path: "/anything"
servers:
- hostname: writer.jwt.auth-gateway.test
  apis:
  - name: metrics
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - issuer-one
      authorization:
        grants:
        - authenticator: issuer-one
          attributes:
            tenant_id:
            - customer-a
  - name: status-only
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - issuer-two
      authorization:
        grants:
        - authenticator: issuer-two
          attributes:
            tenant_id:
            - customer-b
  - name: unmetered
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - issuer-one
      authorization:
        grants:
        - authenticator: issuer-one
          attributes:
            tenant_id:
            - customer-a
- hostname: writer-tls.jwt.auth-gateway.test
  tls_config:
    secret: jwt-gateway-tls
    certificate: "/etc/jwt-gateway-tls/tls.crt"
    private_key: "/etc/jwt-gateway-tls/tls.key"
  apis:
  - name: metrics
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - issuer-one
      authorization:
        grants:
        - authenticator: issuer-one
          attributes:
            tenant_id:
            - customer-a
  - name: status-only
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - issuer-two
      authorization:
        grants:
        - authenticator: issuer-two
          attributes:
            tenant_id:
            - customer-b
  - name: unmetered
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - issuer-one
      authorization:
        grants:
        - authenticator: issuer-one
          attributes:
            tenant_id:
            - customer-a
- hostname: issuer-one-only.jwt.auth-gateway.test
  apis:
  - name: metrics
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - issuer-one
      authorization:
        grants:
        - authenticator: issuer-one
          attributes:
            tenant_id:
            - customer-a
  - name: unmetered
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - issuer-one
      authorization:
        grants:
        - authenticator: issuer-one
          attributes:
            tenant_id:
            - customer-a
kubernetes:
  name: auth-gateway
  namespace: default
  replicas: 1
  service_port: 80
  https_service_port: 443
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: '1'
      memory: 256Mi
