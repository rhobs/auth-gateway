resources:
    - '@type': type.googleapis.com/envoy.config.core.v3.TypedExtensionConfig
      name: envoy.filters.http.api_key_auth
      typed_config:
        '@type': type.googleapis.com/envoy.extensions.common.matching.v3.ExtensionWithMatcher
        extension_config:
            name: envoy.filters.http.api_key_auth
            typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.http.api_key_auth.v3.ApiKeyAuth
                credentials:
                    - client: user_id=logs-writer
                      key: logs-demo-key
                    - client: user_id=metrics-writer
                      key: metrics-demo-key
                forwarding:
                    header: x-auth-gateway-api-key-client
                    hide_credentials: true
                key_sources:
                    - cookie: ""
                      header: x-api-key
                      query: ""
