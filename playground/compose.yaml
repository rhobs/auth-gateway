services:
  mock-oauth2-server:
    image: ${MOCK_OAUTH2_IMAGE:-ghcr.io/navikt/mock-oauth2-server:6.0.4}
    user: "0:0"
    ports:
      - "127.0.0.1:${OAUTH_HOST_PORT:-8443}:8443"
    environment:
      SERVER_PORT: "8443"
      JSON_CONFIG_PATH: /app/config.json
      LOG_LEVEL: info
    volumes:
      - ./mock-oauth2-config.json:/app/config.json:ro
      - ./generated/mock-oauth2.p12:/app/mock-oauth2.p12:ro

  envoy:
    image: ${ENVOY_IMAGE:?Set ENVOY_IMAGE before running Compose, or use make start}
    depends_on:
      - mock-oauth2-server
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:${ENVOY_PORT:-8080}"
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
      - "127.0.0.1:${OTEL_METRICS_HOST_PORT:-8889}:8889"
    volumes:
      - ./generated/envoy.yaml:/etc/auth-gateway/envoy.yaml:ro
      - ./generated/mock-oauth2.crt:/etc/auth-gateway/mock-oauth2.crt:ro
      - ./credentials.yaml:/etc/auth-gateway/api-keys/api-keys.yaml:ro
    command: ["-c", "/etc/auth-gateway/envoy.yaml", "--log-level", "info"]

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:?Set OTEL_COLLECTOR_IMAGE before running Compose, or use make start}
    depends_on:
      - envoy
      - jaeger
    network_mode: service:envoy
    command: ["--config=/etc/collector/config.yaml"]
    volumes:
      - ./generated/otel-collector.yaml:/etc/collector/config.yaml:ro

  jaeger:
    image: ${JAEGER_IMAGE:-jaegertracing/all-in-one:1.73.0}
    ports:
      - "127.0.0.1:${JAEGER_HOST_PORT:-16686}:16686"

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0}
    depends_on:
      - otel-collector
    network_mode: service:envoy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
