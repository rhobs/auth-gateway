---
version: 1
listener:
  port: 8080
authenticators:
- name: playground-key
  api_key:
    header: X-API-Key
  attributes:
    - name: user_id
      from_source: credential
      value: user_id
- name: playground-metrics-jwt
  jwt:
    issuer: https://auth.localhost:8443/metrics
    audiences:
    - auth-gateway-playground
    jwks:
      uri: https://mock-oauth2-server:8443/metrics/jwks
      trusted_ca:
        filename: "/etc/auth-gateway/mock-oauth2.crt"
  attributes:
    - name: user_id
      from_source: claim
      value: [sub]
- name: playground-logs-jwt
  jwt:
    issuer: https://auth.localhost:8443/logs
    audiences:
    - auth-gateway-playground
    jwks:
      uri: https://mock-oauth2-server:8443/logs/jwks
      trusted_ca:
        filename: "/etc/auth-gateway/mock-oauth2.crt"
  attributes:
    - name: user_id
      from_source: claim
      value: [sub]
observability:
  metrics:
    custom_metric_name: gateway_http_requests_total
    enabled: true
    scrape_interval: 5s
    scrape_timeout: 2s
  tracing:
    enabled: true
    endpoint: jaeger:4317
    service_name: auth-gateway-playground
    sampling_percentage: 100
    insecure: true
apis:
- name: playground-public
  upstream:
    address: httpbin.org
    port: 443
    tls_config:
      server_name: httpbin.org
  routes:
  - methods:
    - GET
    path:
      exact: "/anything"
- name: metrics-write
  upstream:
    address: httpbin.org
    port: 443
    tls_config:
      server_name: httpbin.org
  metrics:
    labels:
      user_id: user_id
  routes:
  - methods:
    - POST
    path:
      exact: "/metrics/api/v1/receive"
    rewrite:
      path: "/anything"
    processing:
      request_headers:
      - name: X-Authenticated-User
        from_attribute: user_id
- name: logs
  upstream:
    address: httpbin.org
    port: 443
    tls_config:
      server_name: httpbin.org
  metrics:
    labels:
      user_id: user_id
  routes:
  - methods:
    - POST
    path:
      prefix: "/logs/otlp/"
    rewrite:
      prefix: "/anything/"
    processing:
      request_headers:
      - name: X-Authenticated-User
        from_attribute: user_id
servers:
- hostname: unprotected.localhost
  apis:
  - name: playground-public
    public: true
- hostname: api-key.localhost
  apis:
  - name: metrics-write
    access:
    - name: default
      authentication:
        api_key:
          authenticator: playground-key
      authorization:
        grants:
        - authenticator: playground-key
          attributes:
            user_id:
            - metrics-writer
  - name: logs
    access:
    - name: default
      authentication:
        api_key:
          authenticator: playground-key
      authorization:
        grants:
        - authenticator: playground-key
          attributes:
            user_id:
            - logs-writer
- hostname: jwt.localhost
  apis:
  - name: metrics-write
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - playground-metrics-jwt
      authorization:
        grants:
        - authenticator: playground-metrics-jwt
          attributes:
            user_id:
            - metrics-writer
  - name: logs
    access:
    - name: default
      authentication:
        jwt:
          providers:
          - playground-logs-jwt
      authorization:
        grants:
        - authenticator: playground-logs-jwt
          attributes:
            user_id:
            - logs-writer
- hostname: tenants.localhost
  apis:
  - name: metrics-write
    access:
    - match:
        headers:
          X-Tenant:
            exact: partner
      authentication:
        api_key:
          authenticator: playground-key
      authorization:
        grants:
        - authenticator: playground-key
          attributes:
            user_id:
            - metrics-writer
      tenant: partner
    - match:
        headers:
          X-Tenant:
            exact: internal
      authentication:
        jwt:
          providers:
          - playground-metrics-jwt
      authorization:
        grants:
        - authenticator: playground-metrics-jwt
          attributes:
            user_id:
            - metrics-writer
      tenant: internal
  - name: logs
    access:
    - match:
        headers:
          X-Tenant:
            exact: partner
      authentication:
        api_key:
          authenticator: playground-key
      authorization:
        grants:
        - authenticator: playground-key
          attributes:
            user_id:
            - logs-writer
      tenant: partner
    - match:
        headers:
          X-Tenant:
            exact: internal
      authentication:
        jwt:
          providers:
          - playground-logs-jwt
      authorization:
        grants:
        - authenticator: playground-logs-jwt
          attributes:
            user_id:
            - logs-writer
      tenant: internal
